<div class="lesson-content" aria-live="polite">
  @if (lessonLoading()) {
    <div class="loading-placeholder">
      <lib-spinner type="screen" [diameter]="32" label="Loading lesson..." />
    </div>
  } @else if (lesson()) {
    <div class="lesson-detail">
      <h2 class="text-title-large text-primary">{{ lessonPrefix() }} {{ lesson()!.title }}</h2>

      <nav class="tab-bar" role="tablist">
        <a
          class="tab-button"
          routerLink="summary"
          routerLinkActive="tab-button--active"
          queryParamsHandling="preserve"
          role="tab"
        >
          Summary
        </a>
        <a
          class="tab-button"
          routerLink="exercises"
          routerLinkActive="tab-button--active"
          queryParamsHandling="preserve"
          role="tab"
        >
          Exercises ({{ exerciseCount() }})
        </a>
        @if (isTeacher()) {
          <a
            class="tab-button"
            routerLink="submissions"
            routerLinkActive="tab-button--active"
            queryParamsHandling="preserve"
            role="tab"
          >
            Submissions
          </a>
        }
      </nav>

      <div class="tab-content" role="tabpanel">
        <router-outlet />
      </div>
    </div>
  }
</div>
