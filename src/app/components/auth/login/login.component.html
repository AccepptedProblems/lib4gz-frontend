<div class="login-page">
  <div class="login-illustration" aria-hidden="true">
    <div class="brand-panel">
      <div class="brand-mark">
        <span class="material-icons">school</span>
        <span class="brand-name">Lib4GZ</span>
      </div>
      <div class="mock-card">
        <div class="mock-line mock-line--title"></div>
        <div class="mock-progress"><div class="mock-progress-fill"></div></div>
        <div class="mock-lesson">
          <span class="material-icons">check_circle</span>
          <div class="mock-line"></div>
        </div>
        <div class="mock-lesson">
          <span class="material-icons">check_circle</span>
          <div class="mock-line"></div>
        </div>
        <div class="mock-lesson mock-lesson--pending">
          <span class="material-icons">radio_button_unchecked</span>
          <div class="mock-line"></div>
        </div>
      </div>
      <p class="brand-tagline">Learn at your own pace.<br />Watch your progress add up.</p>
    </div>
  </div>

  <div class="login-form-container">
    <div class="login-form-wrapper">
      <h2 class="text-headline-medium login-heading">Welcome back</h2>
      <p class="text-body-medium login-caption">Sign in to continue learning on Lib4GZ</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-row">
          <lib-input
            formControlName="email"
            label="Email or username"
            type="text"
            [required]="true"
            [error]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid
              ? 'Email or username is required'
              : null"
          />
        </div>

        <div class="form-row">
          <lib-input
            formControlName="password"
            label="Password"
            type="password"
            [required]="true"
            [error]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid
              ? 'Password is required'
              : null"
          />
        </div>

        @if (errorMessage()) {
          <div class="login-error" role="alert">
            {{ errorMessage() }}
          </div>
        }

        <lib-button
          type="submit"
          variant="primary"
          size="lg"
          [isLoading]="isLoading()"
          [disabled]="loginForm.invalid"
        >
          Login
        </lib-button>
      </form>

      <p class="login-register-link text-body-medium">
        Don't have an account? <a routerLink="/register">Register</a>
      </p>
    </div>
  </div>
</div>
