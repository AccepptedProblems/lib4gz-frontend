<div class="login-page">
  <div class="login-illustration" aria-hidden="true">
    <app-auth-brand />
  </div>

  <div class="login-form-container">
    <div class="login-form-wrapper">
      <h2 class="text-headline-medium login-heading">Welcome back</h2>
      <p class="text-body-medium login-caption">Sign in to continue learning on Lib4GZ</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-row">
          <lib-input
            formControlName="email"
            label="Email or username"
            type="text"
            [required]="true"
            [error]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid
              ? 'Email or username is required'
              : null"
          />
        </div>

        <div class="form-row">
          <lib-input
            formControlName="password"
            label="Password"
            type="password"
            [required]="true"
            [error]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid
              ? 'Password is required'
              : null"
          />
        </div>

        @if (errorMessage()) {
          <div class="login-error" role="alert">
            {{ errorMessage() }}
          </div>
        }

        <lib-button
          type="submit"
          variant="primary"
          size="lg"
          [isLoading]="isLoading()"
          [disabled]="loginForm.invalid"
        >
          Login
        </lib-button>
      </form>

      <div class="auth-divider text-body-small">or</div>
      <app-google-sign-in text="signin_with" (credential)="onGoogle($event)" />

      <p class="login-register-link text-body-medium">
        Don't have an account? <a routerLink="/register">Create one</a>
      </p>
    </div>
  </div>
</div>
