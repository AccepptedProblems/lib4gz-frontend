<div class="register-page">
  <div class="register-illustration" aria-hidden="true">
    <app-auth-brand />
  </div>

  <div class="register-form-container">
    <div class="register-form-wrapper">
      <h2 class="text-headline-medium register-heading">Create your account</h2>
      <p class="text-body-medium register-caption">We'll send a 6-digit code to confirm your email</p>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="form-row">
          <lib-input
            formControlName="email"
            label="Email"
            type="email"
            [required]="true"
            [error]="getEmailError()"
          />
        </div>

        @if (emailInUse()) {
          <div class="register-error" role="alert">
            This email already has an account. <a routerLink="/login">Sign in</a> instead.
          </div>
        }

        @if (errorMessage()) {
          <div class="register-error" role="alert">
            {{ errorMessage() }}
          </div>
        }

        <lib-button
          type="submit"
          variant="primary"
          size="lg"
          [isLoading]="isLoading()"
          [disabled]="registerForm.invalid"
        >
          Continue with email
        </lib-button>
      </form>

      <div class="auth-divider text-body-small">or</div>
      <app-google-sign-in text="signup_with" (credential)="onGoogle($event)" />

      <p class="register-login-link text-body-medium">
        Already have an account? <a routerLink="/login">Sign in</a>
      </p>
    </div>
  </div>

  <app-email-code-dialog
    [open]="codeDialogOpen()"
    [email]="flow.email() ?? ''"
    title="Check your email"
    [loading]="isVerifying()"
    [resending]="isResending()"
    [error]="codeError()"
    [cooldownUntil]="flow.cooldownUntil()"
    (verify)="verifyCode($event)"
    (resend)="resendCode()"
    (cancel)="closeCodeDialog()"
  />
</div>
