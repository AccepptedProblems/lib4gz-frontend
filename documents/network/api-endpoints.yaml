openspec: "1.0"
owner: ntn071000@gmail.com
last_reviewed: 2026-09-14
review_cadence: per-release
kind: APIEndpoints
info:
  title: LMS Platform - API Endpoints
  version: "1.0.0"
  description: >
    Complete API endpoint specification for the LMS frontend.
    All endpoints are prefixed with the environment apiUrl base.
  base_url: "{environment.apiUrl}"
  content_type: application/json
  versioning:
    strategy: per-endpoint
    default: v1
    description: >
      The base apiUrl contains only the static '/api' prefix.
      Each endpoint path includes its own version prefix (e.g. /v1/).
      This allows individual endpoints to migrate to /v2 independently.

resources:
  # ──────────────────────────────────────────────────────────────
  # AUTH
  # ──────────────────────────────────────────────────────────────
  auth:
    service:
      name: AuthService
      file: src/app/services/auth.service.ts
      injectable: root
      base_url: "{apiUrl}/v1/auth"
    error_format: >
      Errors arrive as { errors: [{ type, reason }] } with no top-level message.
      Components read them with apiErrorMessage(err, fallback)
      (src/app/shared/utils/api-error.ts).
    endpoints:
      - id: auth.login
        method: POST
        path: /v1/auth/login
        auth: false
        description: Authenticate with password and receive a JWT
        note: >
          `username` accepts a username or an email. Input containing '@' is
          looked up by email (case-insensitive), otherwise by username.
        request: LoginRequest
        response: LoginResponse
        error_responses:
          401: Invalid username or password
        service_method: login(request)   # stores session via storeLoginData

      - id: auth.register-email
        method: POST
        path: /v1/auth/register/email
        auth: false
        description: >
          Sign-up step 1. Sends a 6-digit code to the email. Calling it again for
          the same email is the resend.
        request: StartEmailRegistrationRequest
        response: OtpSentResponse
        error_responses:
          400: Invalid email, or resend requested inside the 60 s cooldown
          409: Email already in use
          503: Could not send email
        service_method: startEmailRegistration(email)

      - id: auth.register-email-verify
        method: POST
        path: /v1/auth/register/email/verify
        auth: false
        description: >
          Called from the code dialog on /register. Checks the code (10 min TTL, 5 attempts)
          and creates a pending registration (15 min TTL) whose id finishes the sign-up.
        request: VerifyEmailRegistrationRequest
        response: RegistrationStartedResponse   # requiresPassword = true
        error_responses:
          400: Invalid code / Code expired or not found / Too many attempts
        service_method: verifyEmailRegistration(email, code)

      - id: auth.register-complete
        method: POST
        path: /v1/auth/register/complete
        auth: false
        description: >
          Final sign-up step (/register/complete) for both email and Google paths. Creates the user and
          signs it in. `password` is required only when the registration has
          requiresPassword = true; blank `name` falls back to the username.
        request: CompleteRegistrationRequest
        response: LoginResponse
        error_responses:
          400: Username rules (min 3, letters and digits) or password rules (min 8)
          404: Registration not found or expired
          409: Username already taken, or email taken meanwhile
        service_method: completeRegistration(request)   # stores session via storeLoginData

      - id: auth.google-sign-in
        method: POST
        path: /v1/auth/google:sign-in
        auth: false
        description: >
          Exchange a Google Identity Services ID token. The account connected to that
          Google id → `login`. An existing account with the same email is refused (never
          joined here; see auth.google-connect). No match → `registration`
          (requiresPassword = false) to finish on /register/complete. Exactly one of the
          two is non-null.
        request: GoogleSignInRequest
        response: GoogleSignInResponse
        error_responses:
          401: Invalid Google token, or Google account email is not verified
          400: An account with this email already exists. Sign in with your password, then connect Google on your profile.
        service_method: googleSignIn(idToken)   # stores session only when `login` is present

      - id: auth.google-connect
        method: POST
        path: /v1/auth/google:connect
        auth: true
        description: >
          Connect (or switch) the signed-in user's Google account. Google id, email,
          emailVerified = true and avatar all come from the token; the same account again
          just refreshes them. The old address is mailed when it changes. This is the
          only way the email changes; the Profile field is read-only.
        request: GoogleSignInRequest
        response: UserResponse
        error_responses:
          401: Invalid Google token, Google account email is not verified, or expired session (interceptor logs out)
          409: That Google account is already connected to another account / Email already in use
        service_method: connectGoogle(idToken)   # AuthService; replaces the stored user

      - id: auth.refresh-token
        method: POST
        path: /v1/auth/refresh-token
        auth: true
        description: Refresh the access token
        status: not_implemented
        note: >
          Backend endpoint exists but is a stub (empty method body).
          Token refresh is not functional yet.
        request: "{}"
        response: Token
        service_method: refreshToken()

    removed_endpoints:
      - id: auth.register
        path: POST /v1/auth/register
        removed_on: 2026-09
        replaced_by: [auth.register-email, auth.register-email-verify, auth.register-complete]

    client_state:
      signals:
        - name: currentUser
          type: "Signal<UserResponse | null>"
          description: Hydrated from localStorage 'user' (JSON) on construction.
        - name: userName
          type: "computed<string>"
          description: currentUser.name || currentUser.username; '' when signed out.
        - name: userInitial
          type: "computed<string>"
          description: First character of userName, uppercased; 'U' when empty.
      local_storage_keys: [access_token, token_expiry, user, user_name, user_role, user_id]

    client_methods:
      # Source of truth is auth.service.ts; behaviour summarised, not copied.
      - name: setCurrentUser(user)
        type: void
        description: >
          Writes 'user' (JSON), 'user_name' (name || username), 'user_role',
          'user_id' to localStorage and sets currentUser. Called on every login
          and whenever a fresh UserResponse arrives (navbar getMe, Profile).

      - name: storeLoginData(response)
        type: void
        visibility: private
        description: storeToken(response.accessToken), then setCurrentUser(response.user).

      - name: storeToken(token)
        type: void
        visibility: private
        description: Writes 'access_token' and 'token_expiry'.

      - name: logout
        type: void
        description: >
          Removes access_token, token_expiry, user, user_name, user_role, user_id;
          sets currentUser to null; wipes the IndexedDB course cache.

      - name: isAuthenticated
        type: boolean
        description: True when access_token exists and token_expiry is in the future.

      - name: getToken
        type: "string | null"
        description: Reads 'access_token'.

      - name: getUserName
        type: string
        description: Returns the userName signal value.

      - name: getUserRole
        type: UserRole
        description: currentUser()?.role, defaulting to UserRole.USER.

      - name: hasRole(...roles)
        type: boolean
        description: True when getUserRole() is one of roles.

  # ──────────────────────────────────────────────────────────────
  # USERS
  # ──────────────────────────────────────────────────────────────
  users:
    service:
      name: UserService
      file: src/app/services/user.service.ts
      injectable: root
      base_url: "{apiUrl}/v1/users"
    endpoints:
      - id: users.grant-teacher
        method: POST
        path: /v1/users/{userId}/grant-teacher
        auth: true
        description: >
          Grant the TEACHER global role to a user. Requires the authenticated
          user to have the ADMIN global role. Returns 403 if the requester
          is not an admin. Returns 400 if the target user already has the
          TEACHER role.
        authorization: Only users with global UserRole.ADMIN may call this endpoint.
        path_params:
          - name: userId
            type: string
            description: ID of the user to grant the TEACHER role to
        request: "{}"
        response: UserResponse
        error_responses:
          403: Requester does not have the ADMIN global role
          400: Target user already has the TEACHER role
          404: User not found
        service_method: grantTeacher(userId)

  # ──────────────────────────────────────────────────────────────
  # ME (the signed-in user's own profile and dashboard data)
  # ──────────────────────────────────────────────────────────────
  me:
    service:
      name: MeService
      file: src/app/services/me.service.ts
      injectable: root
      base_url: "{apiUrl}/v1/users/me"
    note: >
      Moved from /v1/me to /v1/users/me. MeService does not inject AuthService
      (import cycle); callers pass returned UserResponse to AuthService.setCurrentUser.
    endpoints:
      - id: me.get
        method: GET
        path: /v1/users/me
        auth: true
        description: The signed-in user
        response: UserResponse
        error_responses:
          404: User not found
        service_method: getMe()

      - id: me.update
        method: PATCH
        path: /v1/users/me
        auth: true
        description: >
          Update the display name. The email is not part of this request; it changes
          only through auth.google-connect (it is the connected Google account's address).
        request: UpdateMeRequest
        response: UserResponse
        error_responses:
          400: Blank name
        service_method: updateMe(request)

      - id: me.courses
        method: GET
        path: /v1/users/me/courses
        auth: true
        description: Enrolled and created courses in one round-trip (user dashboard)
        response: MeCoursesResponse
        service_method: getCourses()

    removed_endpoints:
      - id: me.email-change   # POST /v1/users/me/email/change
      - id: me.email-verify   # POST /v1/users/me/email/verify
      - id: me.email-resend   # POST /v1/users/me/email/resend
        note: >
          Removed 2026-09-16. The profile no longer changes or confirms the email by code;
          connecting a Google account (auth.google-connect) sets and verifies it.

  # ──────────────────────────────────────────────────────────────
  # COURSES
  # ──────────────────────────────────────────────────────────────
  courses:
    service:
      name: CourseService
      file: src/app/services/course.service.ts
      injectable: root
      base_url: "{apiUrl}/v1/courses"
    endpoints:
      - id: courses.list
        method: GET
        path: /v1/courses
        auth: true
        description: List courses filtered by type
        query_params:
          - name: type
            type: CourseListType
            required: false
            values: [created, enrolled, public]
        response: CourseResponse[]
        service_method: "list(type?)"

      - id: courses.create
        method: POST
        path: /v1/courses
        auth: true
        description: >
          Create a new course. Requires the authenticated user to have the
          global UserRole.TEACHER role. Returns 403 if the user lacks this role.
        authorization: Only users with global UserRole.TEACHER may call this endpoint.
        request: CreateCourseRequest
        response: CourseResponse
        error_responses:
          403: User does not have the TEACHER global role
        service_method: create(request)

      - id: courses.get
        method: GET
        path: /v1/courses/{id}
        auth: true
        description: Get course details by ID
        path_params:
          - name: id
            type: string
            description: Course UUID
        response: CourseResponse
        service_method: get(id)

      - id: courses.get-by-code
        method: GET
        path: /v1/courses/code/{code}
        auth: true
        description: Get course details by its unique numeric code
        path_params:
          - name: code
            type: string
            description: Unique 10-digit numeric course code
        response: CourseResponse
        service_method: getByCode(code)

      - id: courses.update
        method: PATCH
        path: /v1/courses/{id}
        auth: true
        description: Partial update of course fields
        path_params:
          - name: id
            type: string
        request: UpdateCourseRequest
        response: CourseResponse
        service_method: update(id, request)

      - id: courses.delete
        method: DELETE
        path: /v1/courses/{id}
        auth: true
        description: Soft delete a course
        path_params:
          - name: id
            type: string
        response: void
        service_method: delete(id)

      - id: courses.syllabus
        method: GET
        path: /v1/courses/{id}/syllabus
        auth: true
        description: >
          One-shot course shell load: course (with myEnrollment, enrollmentCount,
          progress) + modules + all lessons. Used by CourseLayout / CourseHome /
          CourseMaterial instead of a 4-RTT fan-out. Served through the
          CourseCacheService freshness cache (resource type SYLLABUS).
        authorization: Course creator, ACTIVE-enrolled user, or anyone for PUBLIC courses.
        path_params:
          - name: id
            type: string
        response: SyllabusResponse
        service_method: getSyllabus(id)

  # ──────────────────────────────────────────────────────────────
  # ENROLLMENTS
  # ──────────────────────────────────────────────────────────────
  enrollments:
    service:
      name: EnrollmentService
      file: src/app/services/enrollment.service.ts
      injectable: root
      base_url: "{apiUrl}"
    endpoints:
      - id: enrollments.enroll
        method: POST
        path: /v1/courses/{courseId}/enroll
        auth: true
        description: Request enrollment in a course
        path_params:
          - name: courseId
            type: string
        request: EnrollmentRequest
        request_optional: true
        response: EnrollmentResponse
        service_method: "enroll(courseId, request?)"

      - id: enrollments.list-by-course
        method: GET
        path: /v1/courses/{courseId}/enrollments
        auth: true
        description: List all enrollments for a course
        path_params:
          - name: courseId
            type: string
        response: EnrollmentResponse[]
        service_method: listByCourse(courseId)

      - id: enrollments.my-enrollment
        method: GET
        path: /v1/courses/{courseId}/my-enrollment
        auth: true
        description: Get current user's enrollment for a course
        path_params:
          - name: courseId
            type: string
        response: EnrollmentResponse
        service_method: getMyEnrollment(courseId)

      - id: enrollments.update
        method: PUT
        path: /v1/enrollments/{enrollmentId}
        auth: true
        description: Update enrollment role or status
        path_params:
          - name: enrollmentId
            type: string
        request: UpdateEnrollmentRequest
        response: EnrollmentResponse
        service_method: update(enrollmentId, request)

      - id: enrollments.approve
        method: POST
        path: /v1/enrollments/{enrollmentId}/approve
        auth: true
        description: Approve a pending enrollment request
        path_params:
          - name: enrollmentId
            type: string
        request: "{}"
        response: EnrollmentResponse
        service_method: approve(enrollmentId)

      - id: enrollments.reject
        method: POST
        path: /v1/enrollments/{enrollmentId}/reject
        auth: true
        description: Reject a pending enrollment request
        path_params:
          - name: enrollmentId
            type: string
        request: "{}"
        response: EnrollmentResponse
        service_method: reject(enrollmentId)

      - id: enrollments.delete
        method: DELETE
        path: /v1/enrollments/{enrollmentId}
        auth: true
        description: Remove an enrollment
        path_params:
          - name: enrollmentId
            type: string
        response: void
        service_method: delete(enrollmentId)

  # ──────────────────────────────────────────────────────────────
  # MODULES
  # ──────────────────────────────────────────────────────────────
  modules:
    service:
      name: ModuleService
      file: src/app/services/module.service.ts
      injectable: root
      base_url: "{apiUrl}"
    endpoints:
      - id: modules.create
        method: POST
        path: /v1/courses/{courseId}/modules
        auth: true
        description: Create a new module in a course
        path_params:
          - name: courseId
            type: string
        request: CreateModuleRequest
        response: ModuleResponse
        service_method: create(courseId, request)

      - id: modules.list-by-course
        method: GET
        path: /v1/courses/{courseId}/modules
        auth: true
        description: List all modules in a course
        path_params:
          - name: courseId
            type: string
        response: ModuleResponse[]
        service_method: listByCourse(courseId)

      - id: modules.get
        method: GET
        path: /v1/modules/{moduleId}
        auth: true
        description: Get module details by ID
        path_params:
          - name: moduleId
            type: string
        response: ModuleResponse
        service_method: get(moduleId)

      - id: modules.update
        method: PATCH
        path: /v1/modules/{moduleId}
        auth: true
        description: Partial update of module fields
        path_params:
          - name: moduleId
            type: string
        request: UpdateModuleRequest
        response: ModuleResponse
        service_method: update(moduleId, request)

      - id: modules.delete
        method: DELETE
        path: /v1/modules/{moduleId}
        auth: true
        description: Delete a module
        path_params:
          - name: moduleId
            type: string
        response: void
        service_method: delete(moduleId)

  # ──────────────────────────────────────────────────────────────
  # LESSONS
  # ──────────────────────────────────────────────────────────────
  lessons:
    service:
      name: LessonService
      file: src/app/services/lesson.service.ts
      injectable: root
      base_url: "{apiUrl}"
    endpoints:
      - id: lessons.create
        method: POST
        path: /v1/modules/{moduleId}/lessons
        auth: true
        description: Create a new lesson in a module
        path_params:
          - name: moduleId
            type: string
        request: CreateLessonRequest
        response: LessonResponse
        service_method: create(moduleId, request)

      - id: lessons.list-by-module
        method: GET
        path: /v1/modules/{moduleId}/lessons
        auth: true
        description: List all lessons in a module
        path_params:
          - name: moduleId
            type: string
        response: LessonResponse[]
        service_method: listByModule(moduleId)

      - id: lessons.get
        method: GET
        path: /v1/lessons/{lessonId}
        auth: true
        description: Get lesson details by ID
        path_params:
          - name: lessonId
            type: string
        response: LessonResponse
        service_method: get(lessonId)

      - id: lessons.update
        method: PATCH
        path: /v1/lessons/{lessonId}
        auth: true
        description: Partial update of lesson fields
        path_params:
          - name: lessonId
            type: string
        request: UpdateLessonRequest
        response: LessonResponse
        service_method: update(lessonId, request)

      - id: lessons.delete
        method: DELETE
        path: /v1/lessons/{lessonId}
        auth: true
        description: Delete a lesson
        path_params:
          - name: lessonId
            type: string
        response: void
        service_method: delete(lessonId)

      - id: lessons.visit
        method: POST
        path: /v1/lessons/{lessonId}/visit
        auth: true
        description: >
          Fire-and-forget resume marker, called whenever a lesson is opened.
          Updates the caller's enrollment last-visited position (surfaced back
          via CourseResponse.progress). Idempotent; server no-ops for callers
          without an active enrollment. Completion itself is never client-asserted
          — it is derived server-side from submissions.
        path_params:
          - name: lessonId
            type: string
        response: void (204)
        service_method: ProgressService.recordVisit(visit) — src/app/services/progress.service.ts

  # ──────────────────────────────────────────────────────────────
  # SUMMARIES
  # ──────────────────────────────────────────────────────────────
  summaries:
    service:
      name: SummaryService
      file: src/app/services/summary.service.ts
      injectable: root
      base_url: "{apiUrl}"
    endpoints:
      - id: summaries.get
        method: GET
        path: /v1/lessons/{lessonId}/summary
        auth: true
        description: Get summary content for a lesson
        path_params:
          - name: lessonId
            type: string
        response: SummaryResponse
        service_method: get(lessonId)

      - id: summaries.create-or-update
        method: POST
        path: /v1/lessons/{lessonId}/summary
        auth: true
        description: Create or update summary for a lesson (upsert)
        path_params:
          - name: lessonId
            type: string
        request: CreateSummaryRequest | UpdateSummaryRequest
        response: SummaryResponse
        service_method: createOrUpdate(lessonId, request)

  # ──────────────────────────────────────────────────────────────
  # EXERCISES
  # ──────────────────────────────────────────────────────────────
  exercises:
    service:
      name: ExerciseService
      file: src/app/services/exercise.service.ts
      injectable: root
      base_url: "{apiUrl}"
    endpoints:
      - id: exercises.create
        method: POST
        path: /v1/lessons/{lessonId}/exercises
        auth: true
        description: >
          Create a new exercise in a lesson. Optionally accepts inline
          questions[] to create exercise and questions in a single call.
          Response questionCount reflects any inline-created questions.
        path_params:
          - name: lessonId
            type: string
        request: CreateExerciseRequest
        response: ExerciseResponse
        service_method: create(lessonId, request)

      - id: exercises.list-by-lesson
        method: GET
        path: /v1/lessons/{lessonId}/exercises
        auth: true
        description: List all exercises in a lesson
        path_params:
          - name: lessonId
            type: string
        response: ExerciseResponse[]
        service_method: listByLesson(lessonId)

      - id: exercises.get
        method: GET
        path: /v1/exercises/{exerciseId}
        auth: true
        description: Get exercise details by ID
        path_params:
          - name: exerciseId
            type: string
        response: ExerciseResponse
        service_method: get(exerciseId)

      - id: exercises.update
        method: PATCH
        path: /v1/exercises/{exerciseId}
        auth: true
        description: Partial update of exercise fields
        path_params:
          - name: exerciseId
            type: string
        request: UpdateExerciseRequest
        response: ExerciseResponse
        service_method: update(exerciseId, request)

      - id: exercises.delete
        method: DELETE
        path: /v1/exercises/{exerciseId}
        auth: true
        description: >
          Soft delete an exercise. Sets deleted_at timestamp; record
          remains in the database but is excluded from all queries.
        path_params:
          - name: exerciseId
            type: string
        response: void
        service_method: delete(exerciseId)
        soft_delete_note: >
          Backend uses @SQLDelete with an inline SQL timestamp function
          (not a bind parameter) so Hibernate 6.x only needs to bind
          the entity ID. Example SQL:
          UPDATE exercises SET deleted_at = (EXTRACT(EPOCH FROM NOW()) * 1000)::bigint WHERE id = ?

  # ──────────────────────────────────────────────────────────────
  # QUESTIONS
  # ──────────────────────────────────────────────────────────────
  questions:
    service:
      name: QuestionService
      file: src/app/services/question.service.ts
      injectable: root
      base_url: "{apiUrl}"
    endpoints:
      - id: questions.list-by-exercise
        method: GET
        path: /v1/exercises/{exerciseId}/questions
        auth: true
        description: List all questions for an exercise
        path_params:
          - name: exerciseId
            type: string
        response: QuestionResponse[]
        service_method: listByExercise(exerciseId)

      - id: questions.batch-create
        method: POST
        path: /v1/exercises/{exerciseId}/questions
        auth: true
        description: Batch create questions for an exercise
        path_params:
          - name: exerciseId
            type: string
        request: CreateQuestionsRequest
        response: QuestionResponse[]
        service_method: batchCreate(exerciseId, request)

      - id: questions.batch-update
        method: PATCH
        path: /v1/exercises/{exerciseId}/questions
        auth: true
        description: >
          Batch operation on questions: create new, update existing,
          or delete by ID. Uses QuestionAction enum per item.
        path_params:
          - name: exerciseId
            type: string
        request: UpdateQuestionsRequest
        response: QuestionsResponse
        service_method: batchUpdate(exerciseId, request)
        behavior:
          authorization: Only TEACHER role in the course may call this endpoint.
          actions:
            CREATE: >
              Requires content field. orderIndex auto-increments from the
              current max if omitted. meta defaults to {}, visibility to VISIBLE.
            UPDATE: >
              Requires questionId. Applies only the non-null fields supplied
              (content, orderIndex, meta, visibility). Question must belong
              to the target exercise.
            DELETE: >
              Requires questionId. Performs a soft delete — sets deleted_at
              timestamp via SQL; the record remains in the database but is
              excluded from all future queries. Question must belong to the
              target exercise.
          soft_delete_note: >
            Backend uses @SQLDelete with an inline SQL timestamp function
            (not a bind parameter) so Hibernate 6.x only needs to bind
            the entity ID. Example SQL:
            UPDATE questions SET deleted_at = (EXTRACT(EPOCH FROM NOW()) * 1000)::bigint WHERE id = ?

  # ──────────────────────────────────────────────────────────────
  # SUBMISSIONS
  # ──────────────────────────────────────────────────────────────
  submissions:
    service:
      name: SubmissionService
      file: src/app/services/submission.service.ts
      injectable: root
      base_url: "{apiUrl}"
    endpoints:
      - id: submissions.list-by-lesson
        method: GET
        path: /v1/lessons/{lessonId}/submissions
        auth: true
        description: >
          Teacher review queue for one lesson — composite response grouping
          submissions by exercise. Replaces the per-exercise fan-out on the
          Lesson Submissions tab. Served through the CourseCacheService
          freshness cache (resource type SUBMISSION) when courseId is passed.
        authorization: Teacher in the course.
        path_params:
          - name: lessonId
            type: string
        query_params:
          - name: expand
            type: LessonSubmissionsExpand[]
            required: false
            values: [answers, questions]
        response: LessonSubmissionsResponse
        service_method: "listByLesson(lessonId, options?)"

      - id: submissions.list-by-exercise
        method: GET
        path: /v1/exercises/{exerciseId}/submissions
        auth: true
        description: List all submissions for an exercise
        path_params:
          - name: exerciseId
            type: string
        response: SubmissionResponse[]
        service_method: listByExercise(exerciseId)

      - id: submissions.my-submission
        method: GET
        path: /v1/exercises/{exerciseId}/my-submission
        auth: true
        description: Get current user's submission for an exercise
        path_params:
          - name: exerciseId
            type: string
        response: SubmissionResponse
        service_method: getMySubmission(exerciseId)

      - id: submissions.create-or-update
        method: POST
        path: /v1/exercises/{exerciseId}/submissions
        auth: true
        description: Create or update a submission with answers (upsert)
        path_params:
          - name: exerciseId
            type: string
        request: CreateSubmissionRequest | UpdateSubmissionRequest
        response: SubmissionResponse
        service_method: createOrUpdate(exerciseId, request)

      - id: submissions.get
        method: GET
        path: /v1/submissions/{submissionId}
        auth: true
        description: Get submission details by ID
        path_params:
          - name: submissionId
            type: string
        response: SubmissionResponse
        service_method: get(submissionId)

      - id: submissions.submit
        method: POST
        path: /v1/submissions/{submissionId}/submit
        auth: true
        description: Submit for review (DRAFT -> SUBMITTED)
        path_params:
          - name: submissionId
            type: string
        request: "{}"
        response: SubmissionResponse
        service_method: submit(submissionId)

      - id: submissions.approve
        method: POST
        path: /v1/submissions/{submissionId}/approve
        auth: true
        description: Approve a submission (SUBMITTED -> APPROVED)
        path_params:
          - name: submissionId
            type: string
        request: "{}"
        response: SubmissionResponse
        service_method: approve(submissionId)

      - id: submissions.request-revision
        method: POST
        path: /v1/submissions/{submissionId}/revision
        auth: true
        description: Request revision with optional feedback (SUBMITTED -> NEEDS_REVISION)
        path_params:
          - name: submissionId
            type: string
        request: RevisionRequest
        request_optional: true
        response: SubmissionResponse
        service_method: "requestRevision(submissionId, request?)"

      - id: submissions.add-comment
        method: POST
        path: /v1/answers/{answerId}/comment
        auth: true
        description: Add a teacher comment to a specific student answer
        path_params:
          - name: answerId
            type: string
            description: StudentAnswer UUID
        request: CommentRequest
        response: SubmissionResponse
        service_method: addComment(answerId, request)

  # ──────────────────────────────────────────────────────────────
  # FRESHNESS (client cache validation)
  # ──────────────────────────────────────────────────────────────
  freshness:
    service:
      name: CourseCacheService
      file: src/app/services/course-cache.service.ts
      injectable: root
      base_url: "{apiUrl}"
    endpoints:
      - id: freshness.last-updates
        method: GET
        path: /v1/courses/{courseId}/last-updates
        auth: true
        description: >
          Freshness tokens for the client-side IndexedDB cache: one epoch-millis
          lastUpdate per resource type (SYLLABUS, LESSON, SUMMARY, EXERCISE,
          SUBMISSION), bumped server-side by a Hibernate entity listener on every
          relevant mutation. A type that has never been bumped is 0 — a
          deterministic server answer clients cache against until the first real
          mutation forces a refetch. Tokens are opaque and compared by strict
          equality only; the client clock is never compared to them. The client
          memoizes this response in memory for 30s, so rapid tab switches issue
          zero requests.
        authorization: Course creator, ACTIVE-enrolled user, or anyone for PUBLIC courses (mirrors courses.syllabus).
        path_params:
          - name: courseId
            type: string
        response: LastUpdatesResponse
        service_method: internal — called by cachedGet(); not exposed as a public service method
