openspec: "1.0"
owner: ntn071000@gmail.com
last_reviewed: 2026-09-14
review_cadence: per-release
kind: DataModels
info:
  title: LMS Platform - Data Models
  version: "1.0.0"
  description: >
    TypeScript interfaces and enumerations used across the frontend application.
    All models are located under src/app/shared/models/.

barrel_export:
  file: src/app/shared/models/index.ts
  exports:
    - ./enums
    - ./common.model
    - ./user.model
    - ./auth.model
    - ./course.model
    - ./enrollment.model
    - ./module.model
    - ./lesson.model
    - ./summary.model
    - ./exercise.model
    - ./question.model
    - ./submission.model
    - ./syllabus.model
    - ./lesson-submissions.model
    - ./freshness.model

enums:
  file: src/app/shared/models/enums.ts
  definitions:
    - name: UserRole
      values:
        - ADMIN
        - USER
        - TEACHER
      description: >
        Global user roles. TEACHER role is required to create courses.
        Distinct from EnrollmentRole which governs per-course permissions.

    - name: Visibility
      values:
        - PUBLIC
        - PRIVATE
        - UNLISTED
      description: Course visibility setting

    - name: EnrollmentRole
      values:
        - LEARNER
        - TEACHER
      description: Role of user in a course enrollment

    - name: EnrollmentStatus
      values:
        - PENDING
        - ACTIVE
        - REJECTED
        - INACTIVE
      description: Status of an enrollment request/record

    - name: ExerciseType
      values:
        - TEXT_ANSWER
        - CODE
        - FILE_UPLOAD
        - MULTIPLE_CHOICE
        - PROJECT_LINK
      description: Type of exercise question
      currently_supported:
        - TEXT_ANSWER
        - MULTIPLE_CHOICE
      note: >
        Only TEXT_ANSWER and MULTIPLE_CHOICE are supported in the current
        UI. Other values exist for future expansion.

    - name: SubmissionStatus
      values:
        - DRAFT
        - SUBMITTED
        - APPROVED
        - NEEDS_REVISION
      description: Lifecycle status of a student submission

    - name: QuestionVisibility
      values:
        - VISIBLE
        - HIDDEN
      description: Whether a question is visible to students

    - name: QuestionAction
      values:
        - CREATE
        - UPDATE
        - DELETE
      description: Action type for batch question operations

models:
  # ──────────────────────────────────────────────────────────────
  # COMMON
  # ──────────────────────────────────────────────────────────────
  common:
    file: src/app/shared/models/common.model.ts
    interfaces:
      - name: UserSummary
        description: Lightweight user representation embedded in other responses
        fields:
          - name: id
            type: string
          - name: name
            type: string
          - name: email
            type: string
          - name: avatarUrl
            type: "string | null"

  # ──────────────────────────────────────────────────────────────
  # AUTH
  # ──────────────────────────────────────────────────────────────
  auth:
    file: src/app/shared/models/auth.model.ts
    interfaces:
      - name: LoginRequest
        category: request
        fields:
          - name: username
            type: string
            description: Username or email ('@' → email lookup)
          - name: password
            type: string

      - name: Token
        category: response
        fields:
          - name: token
            type: string
          - name: expiredAt
            type: number
            description: Milliseconds since epoch

      - name: UserResponse
        category: response
        fields:
          - name: id
            type: string
          - name: username
            type: string
          - name: email
            type: string
            description: The address in use; the connected Google account's when there is one. Read-only on Profile
          - name: name
            type: string
            description: Display name; the server falls back to the username when blank
          - name: avatarUrl
            type: "string | null"
            description: From Google on Google sign-up or connect; no upload yet
          - name: role
            type: UserRole
            description: >
              Global user role (ADMIN, TEACHER, or USER), highest wins.
              Determines platform-level permissions such as course creation.
          - name: emailVerified
            type: boolean
            description: Set by sign-up with a code or by connecting a Google account
          - name: googleConnected
            type: boolean
            description: A Google account signs this user in; the Profile button reads "Connect other Google account" instead of "Connect a Google account"

      - name: UpdateMeRequest
        category: request
        fields:
          - name: name
            type: string
            optional: true

      - name: LoginResponse
        category: response
        fields:
          - name: user
            type: UserResponse
          - name: accessToken
            type: Token

      - name: StartEmailRegistrationRequest
        category: request
        fields:
          - name: email
            type: string

      - name: VerifyEmailRegistrationRequest
        category: request
        fields:
          - name: email
            type: string
          - name: code
            type: string
            description: 6 digits

      - name: CompleteRegistrationRequest
        category: request
        fields:
          - name: registrationId
            type: string
            description: "Opaque id (reg_…) from RegistrationStartedResponse"
          - name: username
            type: string
            description: Min 3, letters and digits; permanent
          - name: name
            type: string
            optional: true
          - name: password
            type: string
            optional: true
            description: Required on the email path (min 8); omitted on the Google path

      - name: OtpSentResponse
        category: response
        fields:
          - name: email
            type: string
          - name: cooldownSeconds
            type: number
            description: Seconds before another code may be requested (60)

      - name: RegistrationStartedResponse
        category: response
        description: An unfinished sign-up; registrationId is the only credential for finishing it.
        fields:
          - name: registrationId
            type: string
          - name: email
            type: string
          - name: name
            type: "string | null"
            description: Google name; null on the email path
          - name: avatarUrl
            type: "string | null"
          - name: requiresPassword
            type: boolean
            description: true on the email path, false on the Google path

      - name: GoogleSignInRequest
        category: request
        fields:
          - name: idToken
            type: string
            description: Credential from the Google Identity Services button; body of both auth.google-sign-in and auth.google-connect

      - name: GoogleSignInResponse
        category: response
        description: Exactly one of login (known account) or registration (new account) is set.
        fields:
          - name: login
            type: "LoginResponse | null"
          - name: registration
            type: "RegistrationStartedResponse | null"

  # ──────────────────────────────────────────────────────────────
  # USER
  # ──────────────────────────────────────────────────────────────
  user:
    file: src/app/shared/models/user.model.ts
    interfaces:
      - name: User
        description: Placeholder user interface
        fields: []

  # ──────────────────────────────────────────────────────────────
  # COURSE
  # ──────────────────────────────────────────────────────────────
  course:
    file: src/app/shared/models/course.model.ts
    imports:
      - Visibility from ./enums
      - UserSummary from ./common.model
    interfaces:
      - name: CreateCourseRequest
        category: request
        fields:
          - name: title
            type: string
          - name: description
            type: "string | null"
            optional: true
          - name: visibility
            type: Visibility
            optional: true
            default: PRIVATE
          - name: settings
            type: "Record<string, any>"
            optional: true
            default: "{}"

      - name: UpdateCourseRequest
        category: request
        fields:
          - name: title
            type: "string | null"
            optional: true
          - name: description
            type: "string | null"
            optional: true
          - name: visibility
            type: "Visibility | null"
            optional: true
          - name: settings
            type: "Record<string, any> | null"
            optional: true

      - name: CourseResponse
        category: response
        fields:
          - name: id
            type: string
          - name: code
            type: string
            description: Unique 10-digit numeric course code (auto-generated by backend)
          - name: title
            type: string
          - name: description
            type: "string | null"
          - name: visibility
            type: Visibility
          - name: createdBy
            type: UserSummary
          - name: settings
            type: "Record<string, any>"
          - name: createdAt
            type: number
          - name: updatedAt
            type: number
          - name: moduleCount
            type: "number | null"
            optional: true
          - name: enrollmentCount
            type: "number | null"
            optional: true
          - name: myEnrollment
            type: "EnrollmentSummary | null"
            optional: true
            description: Denormalized caller enrollment; null when unenrolled.
          - name: progress
            type: "CourseProgressResponse | null"
            optional: true
            description: >
              Caller's server-derived progress. Present on enrolled listings
              (GET /v1/users/me/courses) and the syllabus course; null elsewhere.

      - name: CourseProgressResponse
        category: response
        description: >
          Derived from submissions — a lesson counts as done when all of its
          exercises are SUBMITTED/APPROVED. Lessons without exercises are
          excluded, so totalLessons is the count of exercise-bearing lessons;
          totalLessons == 0 means no gradable content (render no percentage).
        fields:
          - name: completedLessons
            type: number
          - name: totalLessons
            type: number
          - name: lastVisitedLessonId
            type: "string | null"
            optional: true
          - name: lastVisitedLessonTitle
            type: "string | null"
            optional: true
          - name: lastVisitedAt
            type: "number | null"
            optional: true

      - name: MeCoursesResponse
        category: response
        description: Dashboard composite from GET /v1/users/me/courses.
        fields:
          - name: enrolled
            type: CourseResponse[]
          - name: created
            type: CourseResponse[]

    types:
      - name: CourseListType
        definition: "'created' | 'enrolled' | 'public'"

  # ──────────────────────────────────────────────────────────────
  # ENROLLMENT
  # ──────────────────────────────────────────────────────────────
  enrollment:
    file: src/app/shared/models/enrollment.model.ts
    imports:
      - EnrollmentRole, EnrollmentStatus from ./enums
      - UserSummary from ./common.model
    interfaces:
      - name: EnrollmentRequest
        category: request
        fields:
          - name: role
            type: EnrollmentRole
            optional: true
            default: LEARNER

      - name: UpdateEnrollmentRequest
        category: request
        fields:
          - name: role
            type: "EnrollmentRole | null"
            optional: true
          - name: status
            type: "EnrollmentStatus | null"
            optional: true

      - name: EnrollmentResponse
        category: response
        fields:
          - name: id
            type: string
          - name: courseId
            type: string
          - name: courseName
            type: string
          - name: user
            type: UserSummary
          - name: role
            type: EnrollmentRole
          - name: status
            type: EnrollmentStatus
          - name: joinedAt
            type: "number | null"
          - name: createdAt
            type: number
          - name: updatedAt
            type: number

  # ──────────────────────────────────────────────────────────────
  # MODULE
  # ──────────────────────────────────────────────────────────────
  module:
    file: src/app/shared/models/module.model.ts
    interfaces:
      - name: CreateModuleRequest
        category: request
        fields:
          - name: title
            type: string
          - name: orderIndex
            type: "number | null"
            optional: true

      - name: UpdateModuleRequest
        category: request
        fields:
          - name: title
            type: "string | null"
            optional: true
          - name: orderIndex
            type: "number | null"
            optional: true

      - name: ModuleResponse
        category: response
        fields:
          - name: id
            type: string
          - name: courseId
            type: string
          - name: title
            type: string
          - name: orderIndex
            type: number
          - name: lessonCount
            type: "number | null"
            optional: true
          - name: createdAt
            type: number
          - name: updatedAt
            type: number

  # ──────────────────────────────────────────────────────────────
  # LESSON
  # ──────────────────────────────────────────────────────────────
  lesson:
    file: src/app/shared/models/lesson.model.ts
    interfaces:
      - name: CreateLessonRequest
        category: request
        fields:
          - name: title
            type: string
          - name: orderIndex
            type: "number | null"
            optional: true

      - name: UpdateLessonRequest
        category: request
        fields:
          - name: title
            type: "string | null"
            optional: true
          - name: orderIndex
            type: "number | null"
            optional: true

      - name: LessonResponse
        category: response
        fields:
          - name: id
            type: string
          - name: moduleId
            type: string
          - name: title
            type: string
          - name: orderIndex
            type: number
          - name: hasSummary
            type: boolean
          - name: exerciseCount
            type: "number | null"
            optional: true
          - name: completed
            type: "boolean | null"
            optional: true
            description: >
              Caller's completion state (syllabus payload only): true/false for
              exercise-bearing lessons, null/absent when the lesson has no
              exercises or the context carries no caller progress.
          - name: completedExerciseCount
            type: "number | null"
            optional: true
            description: >
              Caller's SUBMITTED/APPROVED exercise count (syllabus payload only).
              With exerciseCount it drives the sidebar three-state marker:
              == exerciseCount → full check, in between → partial, 0 → no mark.
          - name: createdAt
            type: number
          - name: updatedAt
            type: number

  # ──────────────────────────────────────────────────────────────
  # SUMMARY
  # ──────────────────────────────────────────────────────────────
  summary:
    file: src/app/shared/models/summary.model.ts
    imports:
      - UserSummary from ./common.model
    interfaces:
      - name: CreateSummaryRequest
        category: request
        fields:
          - name: content
            type: string

      - name: UpdateSummaryRequest
        category: request
        fields:
          - name: content
            type: string

      - name: SummaryResponse
        category: response
        fields:
          - name: id
            type: string
          - name: lessonId
            type: string
          - name: content
            type: string
          - name: editedBy
            type: UserSummary
          - name: version
            type: number
          - name: createdAt
            type: number
          - name: updatedAt
            type: number

  # ──────────────────────────────────────────────────────────────
  # EXERCISE
  # ──────────────────────────────────────────────────────────────
  exercise:
    file: src/app/shared/models/exercise.model.ts
    imports:
      - ExerciseType from ./enums
      - CreateQuestionItem from ./question.model
    interfaces:
      - name: CreateExerciseRequest
        category: request
        fields:
          - name: title
            type: string
          - name: type
            type: ExerciseType
          - name: settings
            type: "Record<string, any>"
            optional: true
            default: "{}"
          - name: orderIndex
            type: "number | null"
            optional: true
          - name: questions
            type: "CreateQuestionItem[]"
            optional: true
            default: "[]"
            description: >
              Optional inline questions to create with the exercise.
              Avoids a separate API call to POST /exercises/{id}/questions.

      - name: UpdateExerciseRequest
        category: request
        fields:
          - name: title
            type: "string | null"
            optional: true
          - name: type
            type: "ExerciseType | null"
            optional: true
          - name: settings
            type: "Record<string, any> | null"
            optional: true
          - name: orderIndex
            type: "number | null"
            optional: true

      - name: ExerciseResponse
        category: response
        fields:
          - name: id
            type: string
          - name: lessonId
            type: string
          - name: title
            type: string
          - name: type
            type: ExerciseType
          - name: settings
            type: "Record<string, any>"
          - name: orderIndex
            type: number
          - name: questionCount
            type: "number | null"
            optional: true
          - name: createdAt
            type: number
          - name: updatedAt
            type: number

  # ──────────────────────────────────────────────────────────────
  # QUESTION
  # ──────────────────────────────────────────────────────────────
  question:
    file: src/app/shared/models/question.model.ts
    imports:
      - QuestionVisibility, QuestionAction from ./enums
    interfaces:
      - name: CreateQuestionItem
        category: request
        description: Single question item for batch creation
        fields:
          - name: content
            type: string
          - name: orderIndex
            type: "number | null"
            optional: true
          - name: meta
            type: "Record<string, any>"
            optional: true
            default: "{}"
            meta_structure:
              MULTIPLE_CHOICE: >
                { options: [{ text: string, isCorrect: boolean }, ...] }
                — Array of answer options. Exactly one must have isCorrect=true.
                Min 2 options, max 6.
              TEXT_ANSWER: >
                {} — Empty object. No answer configuration needed.
          - name: visibility
            type: QuestionVisibility
            optional: true
            default: VISIBLE

      - name: CreateQuestionsRequest
        category: request
        fields:
          - name: questions
            type: CreateQuestionItem[]

      - name: UpdateQuestionItem
        category: request
        description: >
          Single question operation item. Action determines behavior:
          CREATE requires content, UPDATE requires questionId + fields,
          DELETE requires questionId.
        fields:
          - name: action
            type: QuestionAction
          - name: questionId
            type: "string | null"
            optional: true
            description: Required for UPDATE and DELETE
          - name: content
            type: "string | null"
            optional: true
            description: Required for CREATE and UPDATE
          - name: orderIndex
            type: "number | null"
            optional: true
          - name: meta
            type: "Record<string, any> | null"
            optional: true
          - name: visibility
            type: "QuestionVisibility | null"
            optional: true

      - name: UpdateQuestionsRequest
        category: request
        fields:
          - name: questions
            type: UpdateQuestionItem[]

      - name: QuestionResponse
        category: response
        fields:
          - name: id
            type: string
          - name: exerciseId
            type: string
          - name: content
            type: string
          - name: orderIndex
            type: number
          - name: meta
            type: "Record<string, any>"
            meta_structure:
              MULTIPLE_CHOICE: >
                { options: [{ text: string, isCorrect: boolean }, ...] }
              TEXT_ANSWER: "{}"
          - name: visibility
            type: QuestionVisibility
          - name: createdAt
            type: number
          - name: updatedAt
            type: number

      - name: QuestionsResponse
        category: response
        description: Response from batch update operation
        fields:
          - name: created
            type: QuestionResponse[]
          - name: updated
            type: QuestionResponse[]
          - name: deleted
            type: string[]
            description: Array of deleted question IDs

  # ──────────────────────────────────────────────────────────────
  # SUBMISSION
  # ──────────────────────────────────────────────────────────────
  submission:
    file: src/app/shared/models/submission.model.ts
    imports:
      - SubmissionStatus from ./enums
      - UserSummary from ./common.model
    interfaces:
      - name: AnswerRequest
        category: request
        fields:
          - name: questionId
            type: string
          - name: answer
            type: "string | null"

      - name: CreateSubmissionRequest
        category: request
        fields:
          - name: answers
            type: AnswerRequest[]
            optional: true
            default: "[]"

      - name: UpdateSubmissionRequest
        category: request
        fields:
          - name: answers
            type: AnswerRequest[]

      - name: CommentRequest
        category: request
        fields:
          - name: comment
            type: string

      - name: RevisionRequest
        category: request
        fields:
          - name: feedback
            type: "string | null"
            optional: true

      - name: StudentAnswerResponse
        category: response
        fields:
          - name: id
            type: string
          - name: questionId
            type: string
          - name: questionContent
            type: string
          - name: answer
            type: "string | null"
          - name: teacherComment
            type: "string | null"
          - name: createdAt
            type: number
          - name: updatedAt
            type: number

      - name: SubmissionResponse
        category: response
        fields:
          - name: id
            type: string
          - name: exerciseId
            type: string
          - name: user
            type: UserSummary
          - name: status
            type: SubmissionStatus
          - name: answers
            type: "StudentAnswerResponse[] | null"
            optional: true
          - name: createdAt
            type: number
          - name: updatedAt
            type: number
          - name: submittedAt
            type: "number | null"
          - name: approvedAt
            type: "number | null"

  # ──────────────────────────────────────────────────────────────
  # FRESHNESS (client cache validation)
  # ──────────────────────────────────────────────────────────────
  freshness:
    file: src/app/shared/models/freshness.model.ts
    types:
      - name: CacheResourceType
        category: union
        definition: "'SYLLABUS' | 'LESSON' | 'SUMMARY' | 'EXERCISE' | 'SUBMISSION'"
        description: >
          Resource families tracked by the server freshness table. Tokens are
          opaque server-issued epoch millis (0 = never bumped) compared by
          strict equality only — never against the client clock.
    interfaces:
      - name: LastUpdatesResponse
        category: response
        fields:
          - name: courseId
            type: string
          - name: lastUpdates
            type: "Record<CacheResourceType, number>"
            description: Always carries all five resource types; 0 when never bumped.
