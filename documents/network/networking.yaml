openspec: "1.0"
owner: ntn071000@gmail.com
last_reviewed: 2026-09-14
review_cadence: per-release
kind: NetworkConfig
info:
  title: LMS Platform - Networking Configuration
  version: "1.0.0"
  description: >
    HTTP client configuration, interceptors, and environment setup
    for the Angular frontend application.

environment:
  file: src/environments/environment.ts
  development:
    file: src/environments/environment.development.ts
    config:
      apiUrl: "/api"   # proxied by proxy-conf/ (start:local → localhost:8080)
      production: false
      googleClientId: "7006272624-f8n2024mnhstsk6cmtmfss1a1j4ffaip.apps.googleusercontent.com"
  production:
    file: src/environments/environment.ts
    config:
      apiUrl: "https://libforgzbe-7006272624.asia-southeast1.run.app/api"
      production: true
      googleClientId: "7006272624-f8n2024mnhstsk6cmtmfss1a1j4ffaip.apps.googleusercontent.com"
  notes: >
    The apiUrl contains the static '/api' prefix only.
    API version prefixes (e.g. /v1, /v2) are specified per-endpoint
    in each service, allowing mixed versioning across resources.
    googleClientId is the Google OAuth Web client id used by
    GoogleSignInComponent. It is public (not a secret) and identical in both
    files. Its Authorized
    JavaScript origins in Google Cloud must include every origin that serves
    the app (localhost:4200, the Firebase hosting domains).

external_scripts:
  - id: google-identity-services
    src: https://accounts.google.com/gsi/client
    loaded_in: src/index.html   # <head>, async defer
    typings: src/app/shared/types/google-gsi.d.ts   # ambient, no npm package
    consumer: src/app/components/auth/google-sign-in/google-sign-in.component.ts
    notes: >
      Consumer polls every 100 ms (max 50) for google.accounts.id, then
      initialize + renderButton. Callback runs outside NgZone and is re-entered
      with NgZone.run. If blocked, the button does not render.

authentication:
  strategy: jwt
  storage: localStorage
  keys:
    token: access_token
    expiry: token_expiry
    user: user            # JSON UserResponse; hydrates AuthService.currentUser
    user_name: user_name  # name || username
    user_role: user_role
    user_id: user_id      # scopes CourseCacheService entries
  session_storage:
    registration_flow: >
      RegistrationFlowService state { email, registration, cooldownUntil } shared by
      /register (email + code dialog) and /register/complete; cleared on completion.
  header:
    name: access_token
    format: "{token}"
  public_endpoints:
    - POST /v1/auth/login
    - POST /v1/auth/register/email
    - POST /v1/auth/register/email/verify
    - POST /v1/auth/register/complete
    - POST /v1/auth/google:sign-in

app_config:
  file: src/app/app.config.ts
  providers:
    - provideZoneChangeDetection:
        eventCoalescing: true
    - provideRouter:
        source: routes
    - provideAnimationsAsync
    - provideHttpClient:
        interceptors:
          - jwtInterceptor
          - errorInterceptor

interceptors:
  - id: jwt-interceptor
    name: jwtInterceptor
    file: src/app/interceptors/jwt.interceptor.ts
    type: HttpInterceptorFn
    description: >
      Attaches JWT token from localStorage to all outgoing HTTP requests
      except public endpoints.
    behavior:
      - step: Read token from localStorage key 'access_token'
      - step: Check if request URL matches a public endpoint
      - step: If token exists and endpoint is not public, clone request with 'access_token' header
      - step: Forward request to next handler
    skip_endpoints:   # substring match on req.url
      - /auth/login
      - /auth/register   # also covers /auth/register/email, /email/verify, /complete
      - "/auth/google:sign-in"   # spelled in full: /auth/google would also match /auth/google:connect, which needs the token

  - id: error-interceptor
    name: errorInterceptor
    file: src/app/interceptors/error.interceptor.ts
    type: HttpInterceptorFn
    status_note: >
      The refresh-token backend endpoint is currently a stub (not implemented).
      Token refresh logic in this interceptor will not function until the
      backend implements POST /v1/auth/refresh-token.
    description: >
      Handles global HTTP error responses. On 401 Unauthorized,
      attempts a silent token refresh via AuthService.refreshToken().
      If refresh succeeds, retries the original request with the new token.
      If refresh itself returns 401, clears stored tokens and redirects to login.
      Concurrent 401s are queued and resolved after a single refresh call.
    behavior:
      - step: Intercept all HTTP responses via catchError
      - step: On non-401 errors, re-throw immediately
      - step: "On 401 from /auth/refresh-token: call AuthService.logout(), navigate to /login"
      - step: "On 401 from any other URL containing /v1/auth/ (login, register/*, google): re-throw without refresh — it means bad credentials, not an expired session"
      - step: "On 401 from other endpoints and no refresh in progress: initiate AuthService.refreshToken()"
      - step: On refresh success, store new token, retry original request with new access_token header
      - step: "On refresh failure: call AuthService.logout(), navigate to /login"
      - step: "On 401 while refresh already in progress: queue request, retry after refresh completes"
    concurrent_refresh:
      strategy: BehaviorSubject-based queue
      description: >
        A module-level isRefreshing flag and BehaviorSubject<string | null>
        ensure only one refresh call runs at a time. Subsequent 401 requests
        wait for the BehaviorSubject to emit the new token, then retry.

guards:
  - id: auth-guard
    name: authGuard
    file: src/app/guards/auth.guard.ts
    type: CanActivateFn
    description: >
      Protects routes that require authentication.
      Checks AuthService.isAuthenticated() for a valid, non-expired token.
      Redirects to /login via UrlTree if not authenticated.
    status: implemented
    implementation: |
      import { inject } from '@angular/core';
      import { CanActivateFn, Router } from '@angular/router';
      import { AuthService } from '../services/auth.service';

      export const authGuard: CanActivateFn = () => {
        const authService = inject(AuthService);
        const router = inject(Router);

        if (authService.isAuthenticated()) {
          return true;
        }

        return router.createUrlTree(['/login']);
      };

  - id: registration-id-guard
    name: registrationIdGuard
    file: src/app/guards/registration.guard.ts
    type: CanActivateFn
    description: >
      Guards /register/complete. Allows when RegistrationFlowService.registration()
      is set (from the code dialog on /register, or Google); otherwise returns a
      UrlTree to /register. The only registration guard: /register/verify and
      registrationEmailGuard were removed when the code moved into a dialog.
    status: implemented

  - id: role-guard
    name: roleGuard
    file: src/app/guards/role.guard.ts
    type: CanActivateFn
    description: >
      Protects routes that require a specific role.
      Reads required roles from route data.roles array.
    status: placeholder
    data_contract:
      roles: string[]
    implementation: |
      import { CanActivateFn } from '@angular/router';

      export const roleGuard: CanActivateFn = (route, state) => {
        return true;
      };

services:
  barrel_export:
    file: src/app/services/index.ts
    exports:
      - ./auth.service
      - ./course.service
      - ./enrollment.service
      - ./module.service
      - ./lesson.service
      - ./summary.service
      - ./exercise.service
      - ./question.service
      - ./submission.service
      - ./me.service
      - ./registration-flow.service
      - ./progress.service
      - ./course-cache.service
