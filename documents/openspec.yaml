# Non-technical overview of the product: ../../docs/README.md
openspec: "1.0"
owner: ntn071000@gmail.com
last_reviewed: 2026-09-14
review_cadence: per-release
kind: ProjectIndex

info:
  title: LMS Platform Frontend
  version: "2.0.0"
  description: >
    Learning Management System frontend application built with Angular 17+.
    Supports course enrollment, content consumption, exercise submission,
    and teacher management workflows.

    This index points at structured docs. Every screen has PRD (1min/5min/full),
    tech design (1min/5min/full), and a single-version contract.yaml. Reference
    docs (design tokens, color, typography, API endpoints, models) are
    single-version YAML. See `_writing-guidelines.md` and `_document-workflow.md`
    at the root of `documents/` for the rules.
  phase: "1"

project:
  name: lib4gz-fe
  framework: Angular 17+
  language: TypeScript 5+
  styling: SCSS with CSS custom properties
  ui_library: Angular Material (spinner only)
  icons: Material Symbols (Google Fonts)
  state: RxJS 7+ with signal-based inputs

  target_users:
    - role: student
      description: Enroll in courses, view content, complete exercises
    - role: teacher
      description: Create courses, review submissions, manage enrollments

