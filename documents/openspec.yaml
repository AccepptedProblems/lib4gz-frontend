# ════════════════════════════════════════════════════════════════
# EXTERNAL SERVICES
# ════════════════════════════════════════════════════════════════

external_services:
  - id: google-identity-services
    name: Google Identity Services (Sign in with Google)
    script: https://accounts.google.com/gsi/client
    loaded_in: src/index.html
    config: environment.googleClientId   # public OAuth Web client id
    typings: src/app/shared/types/google-gsi.d.ts
    used_by: [auth]
    notes: >
      Browser gets a Google ID token from the rendered button and posts it to
      POST /v1/auth/google:sign-in. No redirect URIs, no client secret. If the script is
      blocked the Google button does not render; email paths still work.

# ════════════════════════════════════════════════════════════════
# SCREENS (active)
# ════════════════════════════════════════════════════════════════

screens:
  # Authentication (public)
  - id: auth
    title: Auth Screens (Sign in & two-step Sign up with code dialog, Google)
    folder: ./screens/auth/
    contract: ./screens/auth/contract.yaml
    prd:
      "1min": ./screens/auth/prd-1min.md
      "5min": ./screens/auth/prd-5min.md
      "full": ./screens/auth/prd-full.md
    design:
      "1min": ./screens/auth/design-1min.md
      "5min": ./screens/auth/design-5min.md
      "full": ./screens/auth/design-full.md
    routes: [/login, /register, /register/complete]   # 6-digit code entered in a dialog on /register
    category: authentication
    target_users: [public]

  # Account (any signed-in user)
  - id: profile
    title: Profile
    folder: ./screens/profile/
    contract: ./screens/profile/contract.yaml
    prd:
      "1min": ./screens/profile/prd-1min.md
      "5min": ./screens/profile/prd-5min.md
      "full": ./screens/profile/prd-full.md
    design:
      "1min": ./screens/profile/design-1min.md
      "5min": ./screens/profile/design-5min.md
      "full": ./screens/profile/design-full.md
    routes: [/profile]
    category: account
    target_users: [student, teacher, admin]

  # Student
  - id: user-dashboard
    title: User Dashboard
    folder: ./screens/user-dashboard/
    contract: ./screens/user-dashboard/contract.yaml
    prd:
      "1min": ./screens/user-dashboard/prd-1min.md
      "5min": ./screens/user-dashboard/prd-5min.md
      "full": ./screens/user-dashboard/prd-full.md
    design:
      "1min": ./screens/user-dashboard/design-1min.md
      "5min": ./screens/user-dashboard/design-5min.md
      "full": ./screens/user-dashboard/design-full.md
    routes: [/]
    category: student
    target_users: [student, teacher]

  - id: course-dashboard
    title: Course Dashboard
    folder: ./screens/course-dashboard/
    contract: ./screens/course-dashboard/contract.yaml
    prd:
      "1min": ./screens/course-dashboard/prd-1min.md
      "5min": ./screens/course-dashboard/prd-5min.md
      "full": ./screens/course-dashboard/prd-full.md
    design:
      "1min": ./screens/course-dashboard/design-1min.md
      "5min": ./screens/course-dashboard/design-5min.md
      "full": ./screens/course-dashboard/design-full.md
    routes: [/course/:id]
    category: student
    target_users: [student]

  - id: summary-view
    title: Summary View
    folder: ./screens/summary-view/
    contract: ./screens/summary-view/contract.yaml
    prd:
      "1min": ./screens/summary-view/prd-1min.md
      "5min": ./screens/summary-view/prd-5min.md
      "full": ./screens/summary-view/prd-full.md
    design:
      "1min": ./screens/summary-view/design-1min.md
      "5min": ./screens/summary-view/design-5min.md
      "full": ./screens/summary-view/design-full.md
    routes: [/course/:courseId/lesson/:lessonId/summary]
    category: student
    target_users: [student]

  - id: lesson-view
    title: Lesson View
    folder: ./screens/lesson-view/
    contract: ./screens/lesson-view/contract.yaml
    prd:
      "1min": ./screens/lesson-view/prd-1min.md
      "5min": ./screens/lesson-view/prd-5min.md
      "full": ./screens/lesson-view/prd-full.md
    design:
      "1min": ./screens/lesson-view/design-1min.md
      "5min": ./screens/lesson-view/design-5min.md
      "full": ./screens/lesson-view/design-full.md
    routes: [/course/:courseId/lesson/:lessonId]
    category: student
    target_users: [student]

  - id: exercise-attempt
    title: Exercise Attempt
    folder: ./screens/exercise-attempt/
    contract: ./screens/exercise-attempt/contract.yaml
    prd:
      "1min": ./screens/exercise-attempt/prd-1min.md
      "5min": ./screens/exercise-attempt/prd-5min.md
      "full": ./screens/exercise-attempt/prd-full.md
    design:
      "1min": ./screens/exercise-attempt/design-1min.md
      "5min": ./screens/exercise-attempt/design-5min.md
      "full": ./screens/exercise-attempt/design-full.md
    routes: [/course/:id/lesson/:lessonId/attempt]
    category: student
    target_users: [student]
    replaces: [exercise-do]

  # Teacher
  - id: course-management
    title: Course Management
    folder: ./screens/course-management/
    contract: ./screens/course-management/contract.yaml
    prd:
      "1min": ./screens/course-management/prd-1min.md
      "5min": ./screens/course-management/prd-5min.md
      "full": ./screens/course-management/prd-full.md
    design:
      "1min": ./screens/course-management/design-1min.md
      "5min": ./screens/course-management/design-5min.md
      "full": ./screens/course-management/design-full.md
    routes: [/course/:id/manage]
    category: teacher
    target_users: [teacher]
    sub_components:
      - id: lesson-detail-management
        kind: ChildComponent
        folder: ./screens/course-management/lesson-detail-management/
        contract: ./screens/course-management/lesson-detail-management/contract.yaml
        prd:
          "1min": ./screens/course-management/lesson-detail-management/prd-1min.md
          "5min": ./screens/course-management/lesson-detail-management/prd-5min.md
          "full": ./screens/course-management/lesson-detail-management/prd-full.md
        design:
          "1min": ./screens/course-management/lesson-detail-management/design-1min.md
          "5min": ./screens/course-management/lesson-detail-management/design-5min.md
          "full": ./screens/course-management/lesson-detail-management/design-full.md
        description: Lesson detail editor inside the Course Material view.
      - id: enrollment-management
        kind: ScreenView
        folder: ./screens/course-management/enrollment-management/
        contract: ./screens/course-management/enrollment-management/contract.yaml
        prd:
          "1min": ./screens/course-management/enrollment-management/prd-1min.md
          "5min": ./screens/course-management/enrollment-management/prd-5min.md
          "full": ./screens/course-management/enrollment-management/prd-full.md
        design:
          "1min": ./screens/course-management/enrollment-management/design-1min.md
          "5min": ./screens/course-management/enrollment-management/design-5min.md
          "full": ./screens/course-management/enrollment-management/design-full.md
        description: >
          Inline view (not a standalone screen) rendered inside course-management.
          Replaces the deprecated /manage/enrollments and /manage/requests routes.
        replaces:
          - _archive/enrollment-management
          - _archive/enrollment-requests

  - id: exercise-editor
    title: Exercise Editor
    folder: ./screens/exercise-editor/
    contract: ./screens/exercise-editor/contract.yaml
    prd:
      "1min": ./screens/exercise-editor/prd-1min.md
      "5min": ./screens/exercise-editor/prd-5min.md
      "full": ./screens/exercise-editor/prd-full.md
    design:
      "1min": ./screens/exercise-editor/design-1min.md
      "5min": ./screens/exercise-editor/design-5min.md
      "full": ./screens/exercise-editor/design-full.md
    routes:
      - /course/:id/manage/exercise/new
      - /course/:id/manage/exercise/:exerciseId/edit
    category: teacher
    target_users: [teacher]

  # Utility
  - id: not-found
    title: Not Found (404)
    folder: ./screens/not-found/
    contract: ./screens/not-found/contract.yaml
    prd:
      "1min": ./screens/not-found/prd-1min.md
      "5min": ./screens/not-found/prd-5min.md
      "full": ./screens/not-found/prd-full.md
    design:
      "1min": ./screens/not-found/design-1min.md
      "5min": ./screens/not-found/design-5min.md
      "full": ./screens/not-found/design-full.md
    routes: ["**"]
    category: utility
    target_users: [all]

