# ════════════════════════════════════════════════════════════════
# USER FLOWS
# ════════════════════════════════════════════════════════════════

user_flows:
  sign_up_email:
    description: New user signs up with an email code, then lands signed in
    steps:
      - { screen: auth, route: /register, note: "email, then the code in app-email-code-dialog" }
      - { screen: auth, route: /register/complete }
      - { screen: user-dashboard, route: / }

  sign_up_google:
    description: New Google user picks a username, then lands signed in
    steps:
      - { screen: auth, route: /login, note: "or /register; Google returns a registration" }
      - { screen: auth, route: /register/complete }
      - { screen: user-dashboard, route: / }

  account:
    description: Signed-in user edits name or email (email confirmed by code)
    steps:
      - { screen: user-dashboard, route: / }
      - { screen: profile, route: /profile, note: "navbar avatar menu → Profile" }

  student:
    description: Student journey through the platform
    steps:
      - { screen: auth, route: /login }
      - { screen: user-dashboard, route: / }
      - { screen: course-dashboard, route: /course/:id }
      - { screen: lesson-view, route: /course/:courseId/lesson/:lessonId }
      - { screen: summary-view, route: /course/:courseId/lesson/:lessonId/summary }
      - { screen: exercise-attempt, route: /course/:id/lesson/:lessonId/attempt }

  teacher:
    description: Teacher management journey
    steps:
      - { screen: auth, route: /login }
      - { screen: user-dashboard, route: / }
      - { screen: course-management, route: /course/:id/manage }
      - { screen: exercise-editor, route: /course/:id/manage/exercise/new }

# ════════════════════════════════════════════════════════════════
# IMPLEMENTATION PHASES
# ════════════════════════════════════════════════════════════════

phases:
  - id: "1A"
    name: Core Auth & Navigation
    screens: [auth, not-found]

  - id: "1D"
    name: Accounts (email sign-up, Google, Profile)
    screens: [auth, profile]

  - id: "1B"
    name: Student Experience
    screens:
      - user-dashboard
      - course-dashboard
      - lesson-view
      - summary-view
      - exercise-attempt

  - id: "1C"
    name: Teacher Experience
    screens:
      - course-management
      - exercise-editor

# ════════════════════════════════════════════════════════════════
# ROUTING
# ════════════════════════════════════════════════════════════════

routing:
  file: src/app/app.routes.ts
  structure:
    - { path: login, screen: auth, guard: none }
    - { path: register, screen: auth, guard: none }
    - { path: register/complete, screen: auth, guard: registrationIdGuard, redirect_on_fail: /register }
    - { path: "", screen: user-dashboard, guard: authGuard, pathMatch: full }
    - { path: profile, screen: profile, guard: authGuard }
    - path: "course/:id"
      guard: authGuard
      children:
        - { path: "", screen: course-dashboard }
        - { path: "lesson/:lessonId", screen: lesson-view }
        - { path: "lesson/:lessonId/summary", screen: summary-view }
        - { path: "lesson/:lessonId/attempt", screen: exercise-attempt }
    - path: "course/:id/manage"
      guard: [authGuard, roleGuard]
      guard_data: { roles: [teacher] }
      children:
        - { path: "", screen: course-management }
        - { path: exercise/new, screen: exercise-editor }
        - { path: "exercise/:exerciseId/edit", screen: exercise-editor }
    - { path: "**", screen: not-found }
