openspec: "1.0"
kind: LayoutComponent
owner: ntn071000@gmail.com
last_reviewed: 2026-09-14
review_cadence: per-release

layout_component:
  id: navbar
  name: Navigation Bar
  target_users: [student, teacher, admin]
  status: implemented
  visible_on:
    - "/"
    - "/profile"
    - "/course/**"
  hidden_on:
    - "/login"
    - "/register"
    - "/register/complete"
    - "/course/:courseId/manage/exercise/**"   # exercise editor
    - "/course/:courseId/lesson/:lessonId/attempt**"  # exercise attempt

component:
  selector: app-navbar
  file: src/app/components/layout/navbar/navbar.component.ts
  template: src/app/components/layout/navbar/navbar.component.html
  styles: src/app/components/layout/navbar/navbar.component.scss
  standalone: true

host:
  # Navbar visibility is decided centrally in AppComponent.
  component: AppComponent
  file: src/app/app.component.ts
  visibility_signal: showNavbar
  hidden_routes:
    - /login
    - /register
    - /register/complete
  hidden_route_patterns:
    - "^\\/course\\/[^/]+\\/manage\\/exercise\\/"
    - "^\\/course\\/[^/]+\\/lesson\\/[^/]+\\/attempt"

related_docs:
  prd:
    - prd-1min.md
    - prd-5min.md
    - prd-full.md
  design:
    - design-1min.md
    - design-5min.md
    - design-full.md
  api_endpoints:
    - me.get          # once per navbar mount when authenticated, result → AuthService.setCurrentUser
  models:
    - UserResponse    # via AuthService.userName / userInitial signals
  shared_components: []   # uses only design-system primitives + Material Symbols icons
  design_system:
    - design-system/theme.yaml#token_mixins/navigation_bar_mixins   # active: navigation-bar-theme-by-primary-color-reverse
    - design-system/typography.yaml#scale/title                     # text-title-medium for brand
    - design-system/tokens.yaml#spacing                             # padding & gap
    - design-system/tokens.yaml#border_radius                       # avatar circle (--radius-full)
    - design-system/tokens.yaml#z_index                             # navbar above content
    - design-system/breakpoints.yaml                                # 768px mobile padding shrink
