openspec: "1.0"
kind: LayoutComponent
owner: ntn071000@gmail.com
last_reviewed: 2026-05-06
review_cadence: per-release

layout_component:
  id: footer
  name: Footer
  status: scaffold
  target_users: [student, teacher]
  purpose: >
    Persistent bottom footer shown on authenticated screens. Displays
    copyright text using the active footer theme.

component:
  selector: app-footer
  file: src/app/components/layout/footer/footer.component.ts
  template: src/app/components/layout/footer/footer.component.html
  styles: src/app/components/layout/footer/footer.component.scss
  standalone: true

mount:
  host: src/app/app.component.html
  position: after-router-outlet
  visibility_signal: showFooter   # computed() in app.component.ts; mirrors showNavbar

visible_on:
  - description: All authenticated routes
    match: default
    notes: Rendered when none of the hidden_on rules match.

hidden_on:
  - description: Public auth screens
    paths: [/login, /register]
    match_query_string: true   # also hidden on /login?next=... etc.
  - description: Exercise editor (teacher-focused full-viewport editor)
    pattern: '^/course/[^/]+/manage/exercise/'
  - description: Lesson attempt (student-focused full-viewport attempt)
    pattern: '^/course/[^/]+/lesson/[^/]+/attempt'

theming:
  active_mixin: footer-theme-by-primary-color
  tokens:
    - --footer-bg-color
    - --footer-text-color
    - --footer-border-color
    - --footer-button-bg-color
    - --footer-button-text-color

responsive:
  - below: 768px
    change: Reduce horizontal padding to var(--spacing-md).

a11y:
  - Uses semantic <footer> element.
  - Any future links must be keyboard focusable and pass contrast against teal background.

related_docs:
  prd:
    - prd-1min.md
    - prd-5min.md
    - prd-full.md
  design:
    - design-1min.md
    - design-5min.md
    - design-full.md
  design_system:
    - ../../design-system/theme.yaml
    - ../../design-system/color.yaml
    - ../../design-system/typography.yaml
    - ../../design-system/tokens.yaml
