openspec: "1.0"
kind: SharedComponent
owner: ntn071000@gmail.com
last_reviewed: 2026-05-06
review_cadence: per-release

input:
  selector: lib-input
  status: implemented
  component:
    file: src/app/shared/components/input/input.component.ts
    template: src/app/shared/components/input/input.component.html
    styles: src/app/shared/components/input/input.component.scss
    standalone: true
    imports: []
    providers:
      - provide: NG_VALUE_ACCESSOR
        useExisting: "forwardRef(() => InputComponent)"
        multi: true

  description: >
    Floating-label text input with ControlValueAccessor. Pure CSS/HTML — no
    external dependency. Label acts as placeholder when empty/unfocused and
    animates to the top border edge on focus or when filled.

  layout:
    width: "100% of parent container by default (fluid)"
    host_display: block
    constraint: >
      Width is set by the parent container. Constrain via host CSS
      (e.g. lib-input { width: 300px; }) or by sizing the parent.

  types:
    - name: InputSize
      definition: "'normal' | 'small'"
    - name: InputType
      definition: "'text' | 'email' | 'password' | 'number' | 'tel' | 'url'"

  inputs:
    - name: label
      type: string
      required: true
      description: Floating label text
    - name: size
      type: InputSize
      default: "'normal'"
      description: "normal = 45px, small = 34px"
    - name: type
      type: InputType
      default: "'text'"
    - name: error
      type: "string | null"
      default: "null"
      description: Error message. When set, input shows error styling.
    - name: disabled
      type: boolean
      default: "false"
    - name: required
      type: boolean
      default: "false"
      description: Shows asterisk on label

  signals:
    - name: value
      type: "signal<string>"
      initial: "''"
      description: Internal CVA-managed value
    - name: focused
      type: "signal<boolean>"
      initial: "false"
    - name: internalDisabled
      type: "signal<boolean>"
      initial: "false"
      description: Set by ControlValueAccessor.setDisabledState()

  computed:
    - name: isFloating
      expression: "this.focused() || this.value().length > 0"
    - name: isDisabled
      expression: "this.disabled() || this.internalDisabled()"

  interfaces:
    - name: ControlValueAccessor
      source: "@angular/forms"
      methods:
        - name: writeValue
        - name: registerOnChange
        - name: registerOnTouched
        - name: setDisabledState
          description: Updates internalDisabled signal

  behavior:
    - Label acts as placeholder when input is empty and not focused
    - On focus or with value, label animates to the top border edge
    - Floating label has a background-color patch to visually cut the border
    - Focused state uses --primary-color for border and label
    - Error state uses --error-color for border and label
    - Required asterisk appended via ::after pseudo-element on label
    - setDisabledState merges with the disabled input
    - onBlur triggers onTouched callback
    - Width fills parent by default; constrain via host CSS or parent

  usage: |
    <!-- Reactive form usage -->
    <form [formGroup]="loginForm">
      <lib-input
        formControlName="email"
        label="Email"
        type="email"
        [required]="true"
        [error]="loginForm.get('email')?.touched &&
                 loginForm.get('email')?.invalid
                 ? 'Valid email is required' : null"
      />
    </form>

    <!-- Small size with ngModel -->
    <lib-input
      label="Search courses..."
      size="small"
      [(ngModel)]="searchQuery"
    />

    <!-- With error -->
    <lib-input
      label="Username"
      [error]="'Username is already taken'"
    />

    <!-- Width fills parent container by default.
         Constrain via parent or host CSS: -->
    <div style="width: 300px">
      <lib-input label="Fixed by parent" />
    </div>
