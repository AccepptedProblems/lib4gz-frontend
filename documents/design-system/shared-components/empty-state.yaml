openspec: "1.0"
kind: SharedComponent
owner: ntn071000@gmail.com
last_reviewed: 2026-05-06
review_cadence: per-release

empty_state:
  selector: lib-empty-state
  status: planned
  component:
    file: src/app/shared/components/empty-state/empty-state.component.ts
    template: src/app/shared/components/empty-state/empty-state.component.html
    styles: src/app/shared/components/empty-state/empty-state.component.scss
    standalone: true
    imports: []

  inputs:
    - name: icon
      type: string
      default: "'inbox'"
      description: Material Symbols icon name
    - name: title
      type: string
      required: true
    - name: message
      type: "string | null"
      default: "null"
      description: Optional descriptive text below title

  slots:
    - name: default
      description: Optional CTA (typically a lib-button)

  behavior:
    - Centered layout (icon, title, message, CTA)
    - Used in empty tables, search results, dashboards

  usage: |
    <lib-empty-state
      icon="school"
      title="No courses yet"
      message="You haven't enrolled in any courses. Browse available courses to get started."
    >
      <lib-button variant="primary" routerLink="/">Browse Courses</lib-button>
    </lib-empty-state>
