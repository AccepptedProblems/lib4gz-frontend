openspec: "1.0"
kind: SharedComponent
owner: ntn071000@gmail.com
last_reviewed: 2026-09-14
review_cadence: per-release

dialog:
  selector: lib-dialog
  status: implemented   # used by app-email-code-dialog (sign-up + Profile); inputs below predate icon/confirmLabel/loading, see the component file
  component:
    file: src/app/shared/components/dialog/dialog.component.ts
    template: src/app/shared/components/dialog/dialog.component.html
    styles: src/app/shared/components/dialog/dialog.component.scss
    standalone: true
    imports: []

  inputs:
    - name: open
      type: boolean
      default: "false"
    - name: title
      type: string
      default: "''"
      description: Header title text
    - name: width
      type: string
      default: "'480px'"
      description: Dialog max-width

  outputs:
    - name: closed
      type: void
      description: Emitted on backdrop click, escape, or close button

  slots:
    - name: default
      description: Body content
    - name: "[dialog-footer]"
      description: Footer slot for action buttons

  behavior:
    - Shadow-xl only (no border) for floating overlay feel
    - Backdrop with blur and --surface-overlay color
    - Focus trap; Tab cycles through dialog focusables
    - Escape closes
    - Backdrop click closes
    - Scale animation on open (0.95 -> 1.0, ease-out)

  usage: |
    <lib-dialog
      [open]="showConfirm"
      title="Confirm Deletion"
      (closed)="showConfirm = false"
    >
      <p>Are you sure you want to delete this course?</p>
      <div dialog-footer>
        <lib-button variant="secondary" (buttonClick)="showConfirm = false">Cancel</lib-button>
        <lib-button variant="destructive" (buttonClick)="onDelete()">Delete</lib-button>
      </div>
    </lib-dialog>
