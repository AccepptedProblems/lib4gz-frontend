openspec: "1.0"
kind: SharedComponent
owner: ntn071000@gmail.com
last_reviewed: 2026-05-06
review_cadence: per-release

button:
  selector: lib-button
  status: implemented
  component:
    file: src/app/shared/components/button/button.component.ts
    template: src/app/shared/components/button/button.component.html
    styles: src/app/shared/components/button/button.component.scss
    standalone: true
    imports: [SpinnerComponent]

  types:
    - name: ButtonVariant
      definition: "'primary' | 'secondary' | 'destructive'"
    - name: ButtonSize
      definition: "'sm' | 'md' | 'lg'"
    - name: ButtonType
      definition: "'button' | 'submit' | 'reset'"

  inputs:
    - name: isLoading
      type: boolean
      default: "false"
      description: Show spinner and disable interaction
    - name: variant
      type: ButtonVariant
      default: "'primary'"
    - name: size
      type: ButtonSize
      default: "'md'"
    - name: disabled
      type: boolean
      default: "false"
    - name: type
      type: ButtonType
      default: "'button'"
      description: Native button type attribute
    - name: routerLink
      type: "string | any[] | null"
      default: "null"
      description: Angular router navigation path
    - name: routerState
      type: "Record<string, any> | null"
      default: "null"
      description: Router state object for navigation
    - name: ariaLabel
      type: "string | null"
      default: "null"

  outputs:
    - name: buttonClick
      type: MouseEvent
      description: Emitted on click (after disabled/loading check)

  computed:
    - name: isDisabled
      expression: "this.disabled() || this.isLoading()"
    - name: spinnerDiameter
      expression: "{ sm: 16, md: 20, lg: 24 }[this.size()]"

  behavior:
    - Returns early when isDisabled
    - If routerLink is set, navigates via Router.navigate()
    - Emits buttonClick after navigation

  usage: |
    <lib-button
      variant="primary"
      size="md"
      [isLoading]="isSubmitting"
      (buttonClick)="onSubmit()"
    >
      Save Changes
    </lib-button>

    <lib-button
      variant="secondary"
      routerLink="/"
    >
      Cancel
    </lib-button>

    <lib-button
      variant="destructive"
      size="sm"
      (buttonClick)="onDelete()"
    >
      Delete
    </lib-button>
