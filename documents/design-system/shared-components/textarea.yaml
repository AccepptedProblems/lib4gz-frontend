openspec: "1.0"
kind: SharedComponent
owner: ntn071000@gmail.com
last_reviewed: 2026-05-06
review_cadence: per-release

textarea:
  selector: lib-textarea
  status: implemented
  component:
    file: src/app/shared/components/textarea/textarea.component.ts
    template: src/app/shared/components/textarea/textarea.component.html
    styles: src/app/shared/components/textarea/textarea.component.scss
    standalone: true
    imports: []

  description: >
    Auto-expanding textarea. Mirrors lib-input visual design (floating label,
    error/disabled states, size variants). Supports CVA and direct
    [value]+(valueChange) binding.

  types:
    - name: TextareaSize
      definition: "'normal' | 'small'"

  inputs:
    - name: label
      type: string
      default: "''"
      description: >
        Floating label. When empty, no label rendered (use ariaLabel for a11y).
    - name: placeholder
      type: string
      default: "''"
      description: >
        Native placeholder. Hidden until the floating label floats (focus or
        has value) when a label is present.
    - name: size
      type: TextareaSize
      default: "'normal'"
      description: >
        normal = 16px padding, 8px radius. small = 12px 16px padding,
        10px radius, 0.875rem font-size.
    - name: error
      type: "string | null"
      default: "null"
      description: >
        Error message shown below the textarea. Border and label switch to
        --error-color when set.
    - name: disabled
      type: boolean
      default: "false"
    - name: required
      type: boolean
      default: "false"
      description: "Adds ' *' after the floating label text."
    - name: minRows
      type: number
      default: "3"
      description: >
        Minimum rows. Sets the native rows attribute. Textarea never shrinks
        below this height during auto-resize.
    - name: maxRows
      type: number
      default: "15"
      description: >
        Maximum rows. Caps height via max-height = maxRows * line-height +
        vertical padding. Overflow-y switches to auto when exceeded.
    - name: ariaLabel
      type: string
      default: "''"
      description: >
        Falls back to label value if not provided.
    - name: value
      type: string
      default: "''"
      description: >
        Direct binding input for non-CVA usage. Ignored when CVA is active
        (writeValue takes precedence).

  outputs:
    - name: valueChange
      type: string
      description: >
        Emitted on every input event. Use with [value] for direct binding.

  cva:
    description: >
      Implements ControlValueAccessor. CVA mode activates on first writeValue
      and the [value] input is then ignored.
    methods:
      - writeValue
      - registerOnChange
      - registerOnTouched
      - setDisabledState

  behavior:
    auto_resize: >
      On every input, height resets to 'auto' then is set to scrollHeight.
      maxHeight = maxRows * line-height (1.5em) + vertical padding + border;
      autoResize clamps to that. overflow-y is hidden by default, auto when
      scrollHeight exceeds maxHeight. Skips hidden elements (offsetParent
      check) so it doesn't collapse inside unopened dialogs. CSS min-height
      (45px normal, 34px small) is the safety floor matching lib-input. On
      value-input changes (or writeValue), resize is scheduled via
      afterNextRender to wait for the DOM update.

  design:
    matches: lib-input
    notes: >
      Same border, focus, error, and disabled treatment as lib-input plus
      the same floating-label animation. Difference: multi-line, no resize
      handle, auto-expanding height.

  usage_patterns:
    - name: Direct binding (no label)
      example: |
        <lib-textarea
          [value]="mySignal()"
          (valueChange)="mySignal.set($event)"
          placeholder="Enter text..."
          [minRows]="3"
          ariaLabel="Description"
        />
    - name: With floating label
      example: |
        <lib-textarea
          label="Exercise Title"
          [value]="title()"
          (valueChange)="title.set($event)"
          [required]="true"
          [error]="titleError()"
          [minRows]="1"
        />
    - name: Small size (inline editing)
      example: |
        <lib-textarea
          [value]="description()"
          (valueChange)="description.set($event)"
          placeholder="Description"
          size="small"
          [minRows]="3"
        />
