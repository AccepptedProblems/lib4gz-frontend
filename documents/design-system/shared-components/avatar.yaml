openspec: "1.0"
kind: SharedComponent
owner: ntn071000@gmail.com
last_reviewed: 2026-09-14
review_cadence: per-release

avatar:
  selector: lib-avatar
  status: implemented   # used by Profile
  component:
    file: src/app/shared/components/avatar/avatar.component.ts
    template: src/app/shared/components/avatar/avatar.component.html
    styles: src/app/shared/components/avatar/avatar.component.scss
    standalone: true
    imports: []

  types:
    - name: AvatarSize
      definition: "'sm' | 'md' | 'lg'"

  inputs:
    - name: src
      type: "string | null"
      default: "null"
      description: Image URL
    - name: name
      type: string
      default: "''"
      description: Used for initials fallback and alt text
    - name: size
      type: AvatarSize
      default: "'md'"
      description: "sm = 28px, md = 36px, lg = 48px"

  computed:
    - name: initials
      expression: "this.name().split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2)"
      description: Up to 2 initials from name
    - name: sizeInPx
      expression: "{ sm: 28, md: 36, lg: 48 }[this.size()]"

  behavior:
    - Renders image when src is provided and loads successfully
    - Falls back to initials on colored bg (no image or load error)
    - Initials use --primary-color-100 bg, --primary-color-700 text
    - Always circular (border-radius: full)

  usage: |
    <lib-avatar src="/api/users/123/avatar" name="John Doe" size="md" />
    <lib-avatar name="Jane Smith" size="lg" />
    <lib-avatar size="sm" />
