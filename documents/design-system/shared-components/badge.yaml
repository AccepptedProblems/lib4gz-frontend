openspec: "1.0"
kind: SharedComponent
owner: ntn071000@gmail.com
last_reviewed: 2026-09-14
review_cadence: per-release

badge:
  selector: lib-badge
  status: implemented   # used by Profile (email status)
  component:
    file: src/app/shared/components/badge/badge.component.ts
    template: src/app/shared/components/badge/badge.component.html
    styles: src/app/shared/components/badge/badge.component.scss
    standalone: true
    imports: []

  types:
    - name: BadgeVariant
      definition: "'primary' | 'success' | 'warning' | 'error' | 'neutral'"

  inputs:
    - name: variant
      type: BadgeVariant
      default: "'neutral'"
      description: Color variant using subtle surface backgrounds
    - name: size
      type: "'sm' | 'md'"
      default: "'md'"

  behavior:
    - Pill-shaped badge, subtle background, darker text
    - ng-content projects label text
    - Each variant maps to a matching surface-*-subtle background

  usage: |
    <lib-badge variant="success">Active</lib-badge>
    <lib-badge variant="warning" size="sm">Pending</lib-badge>
    <lib-badge variant="error">Rejected</lib-badge>
