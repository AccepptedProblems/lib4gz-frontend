openspec: "1.0"
kind: SharedComponent
owner: ntn071000@gmail.com
last_reviewed: 2026-05-06
review_cadence: per-release

card:
  selector: lib-card
  status: planned
  component:
    file: src/app/shared/components/card/card.component.ts
    template: src/app/shared/components/card/card.component.html
    styles: src/app/shared/components/card/card.component.scss
    standalone: true
    imports: []

  types:
    - name: CardVariant
      definition: "'elevated' | 'outlined' | 'flat'"

  inputs:
    - name: variant
      type: CardVariant
      default: "'elevated'"
      description: >
        elevated = border + shadow, outlined = border only, flat = neither.
    - name: hoverable
      type: boolean
      default: "false"
      description: Hover lift effect (shadow-md + translateY(-2px))
    - name: padding
      type: string
      default: "'md'"
      description: "Spacing token: none | sm | md | lg"

  behavior:
    - ng-content projects card body
    - elevated = --border-subtle + --shadow-xs at rest
    - hoverable = transition to --shadow-md + translateY(-2px) on hover
    - outlined = --border-default, no shadow
    - flat = no border, no shadow (background only)

  usage: |
    <lib-card variant="elevated" [hoverable]="true">
      <h3>Course Title</h3>
      <p>Course description text</p>
    </lib-card>

    <lib-card variant="outlined" padding="lg">
      <p>Settings panel content</p>
    </lib-card>
