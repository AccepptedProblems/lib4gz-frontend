openspec: "1.0"
owner: ntn071000@gmail.com
last_reviewed: 2026-05-06
review_cadence: quarterly
kind: ColorSystem
info:
  title: LMS Platform - Color System
  version: "1.0.0"
  description: >
    Two-layer color system. Base colors defined in _color.scss provide
    default fallbacks. Theme file (theme-forest.scss) overrides primary
    and neutral palettes, plus adds semantic colors and surface overrides.

# ──────────────────────────────────────────────────────────────
# BASE COLORS (fallback defaults)
# ──────────────────────────────────────────────────────────────
base_colors:
  file: src/assets/design-system/_color.scss
  selector: ":root"
  description: >
    Default color palette. These are overridden by the active theme.
    The base primary uses a blue palette; the active theme (Mint) replaces it.

  primary:
    description: "Base primary (Blue) - overridden by theme"
    tokens:
      - { name: --primary-color-900, value: "#0f3375" }
      - { name: --primary-color-800, value: "#13459c" }
      - { name: --primary-color-700, value: "#1557c0" }
      - { name: --primary-color-600, value: "#196bde" }
      - { name: --primary-color-500, value: "#3a7dfb" }
      - { name: --primary-color-400, value: "#4b9cf9" }
      - { name: --primary-color-300, value: "#77b6fb" }
      - { name: --primary-color-200, value: "#a4cefc" }
      - { name: --primary-color-100, value: "#cce4fd" }
      - { name: --primary-color-50, value: "#e8f3fe" }

  neutral:
    description: "Grayscale palette (0=white, 9=darkest)"
    tokens:
      - { name: --neutral-color-0, value: "#ffffff" }
      - { name: --neutral-color-1, value: "#f8f8f8" }
      - { name: --neutral-color-2, value: "#f2f2f2" }
      - { name: --neutral-color-3, value: "#e4e4e4" }
      - { name: --neutral-color-4, value: "#cecece", note: "Default border" }
      - { name: --neutral-color-5, value: "#adadad", note: "Placeholder text" }
      - { name: --neutral-color-6, value: "#808080" }
      - { name: --neutral-color-7, value: "#646464", note: "Secondary text" }
      - { name: --neutral-color-8, value: "#484848" }
      - { name: --neutral-color-9, value: "#333333", note: "Primary text" }

  warning:
    description: "Warning / amber-orange scale (10 shades)"
    tokens:
      - { name: --warning-color-0, value: "#fff8e1" }
      - { name: --warning-color-1, value: "#ffe082" }
      - { name: --warning-color-2, value: "#ffd54f" }
      - { name: --warning-color-3, value: "#ffca28" }
      - { name: --warning-color-4, value: "#ffb300" }
      - { name: --warning-color-5, value: "#ffa000" }
      - { name: --warning-color-6, value: "#ff8f00" }
      - { name: --warning-color-7, value: "#ff6f00" }
      - { name: --warning-color-8, value: "#e86722" }
      - { name: --warning-color-9, value: "#e0562c" }

  success:
    description: "Success / green scale (10 shades)"
    tokens:
      - { name: --success-color-0, value: "#e8f5e9" }
      - { name: --success-color-1, value: "#c8e6c9" }
      - { name: --success-color-2, value: "#a5d6a7" }
      - { name: --success-color-3, value: "#81c784" }
      - { name: --success-color-4, value: "#66bb6a" }
      - { name: --success-color-5, value: "#4caf50" }
      - { name: --success-color-6, value: "#43a047" }
      - { name: --success-color-7, value: "#388e3c" }
      - { name: --success-color-8, value: "#2e7d32" }
      - { name: --success-color-9, value: "#1b5e20" }

  error:
    description: "Error / red scale (10 shades)"
    tokens:
      - { name: --error-color-0, value: "#ffebee" }
      - { name: --error-color-1, value: "#ffcdd2" }
      - { name: --error-color-2, value: "#ef9a9a" }
      - { name: --error-color-3, value: "#e57373" }
      - { name: --error-color-4, value: "#ef5350" }
      - { name: --error-color-5, value: "#f44336" }
      - { name: --error-color-6, value: "#e53935" }
      - { name: --error-color-7, value: "#d32f2f" }
      - { name: --error-color-8, value: "#c62828" }
      - { name: --error-color-9, value: "#b71c1c" }

# ──────────────────────────────────────────────────────────────
# ACTIVE THEME COLORS (Forest — warm green on paper)
# ──────────────────────────────────────────────────────────────
theme_colors:
  file: src/assets/design-system/theme/theme-forest.scss
  selector: ":root"
  description: >
    Active theme overrides. These values take precedence over base colors.

  primary:
    description: >
      Forest primary palette — warm green (hue ~140°); overrides base blue in
      _color.scss. Light steps blend toward paper (#f4f1eb) instead of white.
      600 (buttons) and 700 (links/text) pass WCAG AA against paper and under
      white text.
    tokens:
      - { name: --primary-color-900, value: "#1d3a29" }
      - { name: --primary-color-800, value: "#29513a" }
      - { name: --primary-color-700, value: "#336247" }
      - { name: --primary-color-600, value: "#3f7455", note: "Base primary" }
      - { name: --primary-color-500, value: "#4d8763" }
      - { name: --primary-color-400, value: "#6fa17f" }
      - { name: --primary-color-300, value: "#9dbd9f" }
      - { name: --primary-color-200, value: "#c3d6c0" }
      - { name: --primary-color-100, value: "#dfe8d9" }
      - { name: --primary-color-50, value: "#eef1e6" }

  neutral:
    description: >
      Declared in theme — _color.scss is not imported, so theme is the sole
      source. Warmed toward paper so dividers and secondary text don't read
      blue-gray on the cream page.
    tokens:
      - { name: --neutral-color-0, value: "#ffffff" }
      - { name: --neutral-color-1, value: "#f7f5f0" }
      - { name: --neutral-color-2, value: "#f0ede6" }
      - { name: --neutral-color-3, value: "#e3dfd5" }
      - { name: --neutral-color-4, value: "#ccc8bd", note: "Default border" }
      - { name: --neutral-color-5, value: "#a9a69d", note: "Placeholder text, input border" }
      - { name: --neutral-color-6, value: "#7d7b74" }
      - { name: --neutral-color-7, value: "#62605a", note: "Secondary text" }
      - { name: --neutral-color-8, value: "#454440" }
      - { name: --neutral-color-9, value: "#141414", note: "Primary text (ink)" }

  semantic:
    description: "Semantic shorthand colors (WCAG AA on paper backgrounds)"
    tokens:
      - { name: --warning-color, value: "#e65100" }
      - { name: --success-color, value: "#388e3c" }
      - { name: --error-color, value: "#d32f2f" }

  text:
    description: "Text color tokens"
    tokens:
      - { name: --text-color-on-primary-bg, value: "var(--neutral-color-0)" }
      - { name: --button-text-color, value: "var(--neutral-color-0)" }

  surfaces:
    description: >
      Theme overrides of the surface tokens defined in tokens/_token.scss
      (see theme.yaml for the full default set). Unified paper: page and
      raised elements share the paper background; floating elements separate
      by shadow, not color. Inputs stay white — the brightest thing on the page.
    tokens:
      - { name: --surface-page, value: "#f4f1eb", note: "Main page background (paper)" }
      - { name: --surface-raised, value: "#f4f1eb", note: "Cards, dropdowns, side-sheets, modals (paper + shadow)" }
      - { name: --surface-input, value: "#ffffff", note: "Form fields" }
      - { name: --surface-sunken, value: "#ede9e0", note: "Wells, progress tracks (paper-dark)" }
      - { name: --surface-hover, value: "#ede9e0", note: "Row/item hover (paper-dark)" }
      - { name: --surface-veil, value: "rgba(244, 241, 235, 0.8)", note: "Loading veil (paper-tinted)" }
      - { name: --surface-selected, value: "var(--primary-color-50)", note: "Selected items (from default mixin)" }
      - { name: --surface-primary-subtle, value: "var(--primary-color-100)", note: "Tinted chips/banners (from default mixin)" }
      - { name: --surface-brand, value: "var(--primary-color-50)", note: "Auth brand panels (from default mixin)" }
      - { name: --surface-success-subtle, value: "#e8f5e9", note: "From default mixin" }
      - { name: --surface-warning-subtle, value: "#fff8e1", note: "From default mixin" }
      - { name: --surface-error-subtle, value: "#ffebee", note: "From default mixin" }
      - { name: --surface-overlay, value: "rgba(0, 0, 0, 0.5)", note: "Modal backdrops (from default mixin)" }
