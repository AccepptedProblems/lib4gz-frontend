openspec: "1.0"
owner: ntn071000@gmail.com
last_reviewed: 2026-05-06
review_cadence: quarterly
kind: SharedPipes
info:
  title: LMS Platform - Shared Angular Pipes
  version: "1.0.0"
  description: >
    Reusable Angular standalone pipes used across the application.
    Located in src/app/shared/pipes/.

barrel_export:
  file: src/app/shared/pipes/index.ts
  exports:
    - ./linkify.pipe

pipes:
  - id: linkify
    name: LinkifyPipe
    selector: linkify
    file: src/app/shared/pipes/linkify.pipe.ts
    standalone: true
    description: >
      Detects plain-text URLs (http:// and https://) in string content and
      converts them to clickable <a> tags. Preserves existing HTML tags and
      does not double-linkify URLs already inside <a> elements or HTML
      attributes (href, src).
    input: "string | null | undefined"
    output: SafeHtml
    dependencies:
      - DomSanitizer (Angular platform-browser)
    behavior:
      - Splits input into HTML-tag segments and plain-text segments
      - Only processes plain-text segments for URL detection
      - Skips content inside existing <a>...</a> tags
      - Matches URLs starting with http:// or https://
      - Wraps matched URLs in <a href="URL" target="_blank" rel="noopener noreferrer">URL</a>
      - Returns result as trusted HTML via DomSanitizer.bypassSecurityTrustHtml()
    usage:
      template: '[innerHTML]="content | linkify"'
      import: "import { LinkifyPipe } from '../shared/pipes';"
      component_imports: "imports: [LinkifyPipe]"
    used_by:
      - component: CourseDashboardComponent
        file: src/app/components/course/course-dashboard/course-dashboard.component.ts
        context: Summary tab content rendering
      - component: LessonDetailManagementComponent
        file: src/app/components/course-teacher/course-management/lesson-detail-management/lesson-detail-management.component.ts
        context: Summary content preview (view mode)
    link_styling:
      color: "var(--primary-color)"
      text_decoration: underline
      hover: "text-decoration: none"
      note: >
        Styling is applied via the parent component's SCSS on .summary-content a
        or .summary-preview a selectors, not within the pipe itself.
