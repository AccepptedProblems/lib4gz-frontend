openspec: "1.0"
kind: ScreenContract
owner: ntn071000@gmail.com
last_reviewed: 2026-05-06
review_cadence: per-release

screen:
  id: course-dashboard
  name: Course Dashboard
  routes:
    - /course/:id
  guard: [authGuard]
  guard_note: >
    authGuard is applied on the parent route "course/:id". This component
    renders at the default child path (empty string).
  guard_data:
    roles: []
  target_users: [student, teacher]
  status: scaffold

component:
  selector: app-course-dashboard
  file: src/app/components/course/course-dashboard/course-dashboard.component.ts
  template: src/app/components/course/course-dashboard/course-dashboard.component.html
  styles: src/app/components/course/course-dashboard/course-dashboard.component.scss
  standalone: true

related_docs:
  prd:
    - prd-1min.md
    - prd-5min.md
    - prd-full.md
  design:
    - design-1min.md
    - design-5min.md
    - design-full.md
  api_endpoints:
    - courses.get
    - modules.list-by-course
    - enrollments.my-enrollment
    - enrollments.enroll
    - lessons.list-by-module
    - summaries.get
    - exercises.list-by-lesson
    - submissions.my-submission
    - submissions.list-by-exercise
    - submissions.get
    - questions.list-by-exercise
  models:
    - course
    - module
    - lesson
    - summary
    - exercise
    - submission
    - enrollment
    - question
    - common
  shared_components:
    - lib-button
    - lib-badge
    - lib-chip
    - lib-skeleton
    - lib-spinner
    - mat-drawer
