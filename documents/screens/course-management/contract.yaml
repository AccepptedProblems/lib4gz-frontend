openspec: "1.0"
kind: ScreenContract
owner: ntn071000@gmail.com
last_reviewed: 2026-05-06
review_cadence: per-release

screen:
  id: course-management
  name: Course Management
  routes:
    - /course/:id/manage
  guard: [authGuard, roleGuard]
  guard_data:
    roles: [teacher]
  target_users: [teacher]
  status: scaffold

component:
  selector: app-course-management
  file: src/app/components/course-teacher/course-management/course-management.component.ts
  template: src/app/components/course-teacher/course-management/course-management.component.html
  styles: src/app/components/course-teacher/course-management/course-management.component.scss
  standalone: true

children:
  - id: lesson-detail-management
    selector: app-lesson-detail-management
    contract: ./lesson-detail-management/contract.yaml
  - id: enrollment-management
    selector: app-enrollment-management
    contract: ./enrollment-management/contract.yaml

related_docs:
  prd:
    - prd-1min.md
    - prd-5min.md
    - prd-full.md
  design:
    - design-1min.md
    - design-5min.md
    - design-full.md
  api_endpoints:
    - courses.get
    - courses.update
    - modules.list-by-course
    - modules.create
    - modules.update
    - modules.delete
    - lessons.list-by-module
    - lessons.create
    - lessons.update
    - lessons.delete
    - enrollments.list-by-course
  models:
    - course
    - module
    - lesson
    - enrollment
    - common
  shared_components:
    - lib-button
    - lib-badge
    - lib-input
    - lib-dialog
    - lib-skeleton
    - lib-spinner
    - lib-toast
