openspec: "1.0"
kind: ScreenContract
owner: ntn071000@gmail.com
last_reviewed: 2026-05-06
review_cadence: per-release

screen:
  id: exercise-attempt
  name: Exercise Attempt
  routes:
    - /course/:id/lesson/:lessonId/attempt
  guard: [authGuard]
  target_users: [student]
  status: scaffold
  replaces:
    - exercise-do        # archived: documents/_archive/exercise-do/
    - exercise-attempt-overview  # previous single-exercise version of this screen

route_params:
  - name: id
    type: string
    description: Course ID — used for Cancel/Submit return navigation.
  - name: lessonId
    type: string
    description: Lesson ID — used to load all exercises in the lesson.

query_params:
  - name: prefix
    type: string
    required: false
    description: Lesson position prefix from the course dashboard (e.g. "1.2") for the header title.

component:
  selector: app-exercise-attempt
  file: src/app/components/course/exercise-attempt/exercise-attempt.component.ts
  template: src/app/components/course/exercise-attempt/exercise-attempt.component.html
  styles: src/app/components/course/exercise-attempt/exercise-attempt.component.scss
  standalone: true

related_docs:
  prd:
    - prd-1min.md
    - prd-5min.md
    - prd-full.md
  design:
    - design-1min.md
    - design-5min.md
    - design-full.md
  api_endpoints:
    - exercises.list-by-lesson      # GET /v1/lessons/{lessonId}/exercises
    - questions.list-by-exercise    # GET /v1/exercises/{exerciseId}/questions
    - submissions.my-submission     # GET /v1/exercises/{exerciseId}/my-submission
    - submissions.create-or-update  # POST /v1/exercises/{exerciseId}/submissions
    - submissions.submit            # POST /v1/submissions/{submissionId}/submit
  models:
    - ExerciseResponse
    - QuestionResponse
    - SubmissionResponse
    - ExerciseType         # enum: TEXT_ANSWER | CODE | FILE_UPLOAD | MULTIPLE_CHOICE | PROJECT_LINK
    - SubmissionStatus     # enum: DRAFT | SUBMITTED | APPROVED | NEEDS_REVISION
  shared_components:
    - lib-button
    - lib-textarea
    - lib-dialog
    - lib-spinner
  related_screens:
    - course-dashboard     # entry point; receives Cancel/Submit return navigation
